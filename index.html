    <style>
      /* Critical CSS - Above the fold styles */
      
      /* CSS Variables - Design tokens */
      :root {
        --bg-main: 14 17 22;
        --bg-secondary: 18 21 28;
        --bg-glass: 255 255 255;
        --text-main: 230 234 240;
        --text-muted: 169 176 194;
        --accent-primary: 58 122 254;
        --glass-opacity: 0.06;
        --blur-civic: 12px;
        --radius: 16px;
        --font-sans: 'Inter', 'IBM Plex Sans', 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      /* Base styles */
      * {
        box-sizing: border-box;
      }
      
      body {
        background-color: rgb(var(--bg-main));
        color: rgb(var(--text-main));
        font-family: var(--font-sans);
        font-size: 14px;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Loading indicator shown until React hydrates */
      #root:empty::before {
        content: "";
        display: block;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      #root:empty::after {
        content: "Chargement...";
        display: block;
        position: fixed;
        top: calc(50% + 40px);
        left: 50%;
        transform: translateX(-50%);
        color: rgb(var(--text-main));
        font-size: 16px;
      }
      
      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
      
      /* Ensure no content is hidden behind black screen */
      #root {
        min-height: 100vh;
      }
      
      /* Critical glass effect utilities */
      .glass-effect {
        background: rgba(var(--bg-glass), var(--glass-opacity));
        backdrop-filter: blur(var(--blur-civic));
        -webkit-backdrop-filter: blur(var(--blur-civic));
      }
      
      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
