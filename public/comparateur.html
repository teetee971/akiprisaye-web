<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Comparateur de prix • A KI PRI SA YÉ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Comparez les prix des produits dans votre territoire d'outre-mer et exportez vos résultats">
  
  <!-- SEO Meta Tags -->
  <meta name="keywords" content="comparateur prix, DROM-COM, Guadeloupe, Martinique, Guyane, Réunion, Mayotte, budget, vie chère" />
  <meta name="author" content="A KI PRI SA YÉ" />
  <meta name="robots" content="index, follow" />
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Comparateur de prix • A KI PRI SA YÉ" />
  <meta property="og:description" content="Comparez les prix des produits dans votre territoire d'outre-mer et exportez vos résultats" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://akiprisaye.pages.dev/comparateur.html" />
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Comparateur de prix • A KI PRI SA YÉ" />
  <meta name="twitter:description" content="Comparez les prix des produits dans votre territoire d'outre-mer et exportez vos résultats" />

  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: #0b1220; color: #e7eefc; font-family: system-ui; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .form-group { margin: 15px 0; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group select { 
      width: 100%; max-width: 300px; padding: 10px; border: 1px solid #374151; 
      border-radius: 6px; background: #1f2937; color: #e7eefc; 
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #3b82f6; }
    .error { color: #ef4444; font-size: 0.875rem; margin-top: 5px; }
    .btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; margin: 5px; }
    .btn:hover { background: #2563eb; }
    .btn.secondary { background: #6b7280; }
    .btn.secondary:hover { background: #4b5563; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .results { margin-top: 30px; }
    .result-item { 
      background: #0f1629; border: 1px solid #1e2945; border-radius: 8px; 
      padding: 15px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center;
    }
    .result-item.best-price { border-color: #059669; background: rgba(5, 150, 105, 0.1); }
    .store-info { flex: 1; }
    .price-info { text-align: right; font-weight: 600; font-size: 1.125rem; }
    .price-per-unit { font-size: 0.875rem; opacity: 0.8; }
    .loading { text-align: center; padding: 40px; color: #6b7280; }
    .no-results { text-align: center; padding: 40px; color: #6b7280; }
    .export-section { margin: 20px 0; padding: 20px; background: #0f1629; border-radius: 8px; }
    .suggestions { margin-top: 30px; padding: 20px; background: rgba(59, 130, 246, 0.1); border-radius: 8px; }
    .suggestion-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .suggestion-item:last-child { border-bottom: none; }
    @media (max-width: 768px) {
      .result-item { flex-direction: column; text-align: center; }
      .price-info { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛒 Comparateur de prix</h1>
      <p>Trouvez les meilleurs prix dans votre territoire</p>
    </header>

    <form id="search-form" novalidate>
      <div class="form-group">
        <label for="produit">Produit recherché *</label>
        <input type="text" id="produit" name="produit" required 
               placeholder="Ex: lait, banane, riz..." 
               minlength="2" maxlength="100">
        <div class="error" id="produit-error"></div>
      </div>

      <div class="form-group">
        <label for="territoire">Territoire *</label>
        <select id="territoire" name="territoire" required>
          <option value="">Sélectionnez votre territoire</option>
          <option value="guadeloupe">🇬🇵 Guadeloupe</option>
          <option value="martinique">🇲🇶 Martinique</option>
          <option value="guyane">🇬🇫 Guyane</option>
          <option value="reunion">🇷🇪 Réunion</option>
          <option value="mayotte">🇾🇹 Mayotte</option>
          <option value="saint-martin">🇲🇫 Saint-Martin</option>
          <option value="saint-barthelemy">🇧🇱 Saint-Barthélemy</option>
        </select>
        <div class="error" id="territoire-error"></div>
      </div>

      <button type="submit" class="btn">🔍 Comparer les prix</button>
    </form>

    <div id="loading" class="loading" style="display: none;">
      🔄 Recherche en cours...
    </div>

    <div id="results" class="results" style="display: none;">
      <div class="export-section">
        <h3>📊 Exporter les résultats</h3>
        <button class="btn success" onclick="exportToExcel()">📗 Exporter Excel</button>
        <button class="btn secondary" onclick="exportToPDF()">📄 Exporter PDF</button>
        <button class="btn secondary" onclick="shareResults()">📤 Partager</button>
      </div>
      
      <div id="results-list"></div>
    </div>

    <div id="suggestions" class="suggestions" style="display: none;">
      <h3>💡 Suggestions d'alternatives locales</h3>
      <div id="suggestions-list"></div>
    </div>

    <div id="no-results" class="no-results" style="display: none;">
      ❌ Aucun résultat trouvé pour ce produit dans ce territoire.
      <br><br>
      <button class="btn secondary" onclick="suggestProduct()">📝 Suggérer ce produit</button>
    </div>
  </div>

  <script>
    let currentResults = [];
    let currentSearch = {};

    // Form validation
    function validateForm() {
      const form = document.getElementById('search-form');
      const produit = document.getElementById('produit');
      const territoire = document.getElementById('territoire');
      let isValid = true;

      // Clear previous errors
      document.querySelectorAll('.error').forEach(error => error.textContent = '');

      // Validate product
      if (!produit.value.trim()) {
        document.getElementById('produit-error').textContent = 'Le nom du produit est requis';
        isValid = false;
      } else if (produit.value.trim().length < 2) {
        document.getElementById('produit-error').textContent = 'Le nom du produit doit contenir au moins 2 caractères';
        isValid = false;
      }

      // Validate territory
      if (!territoire.value) {
        document.getElementById('territoire-error').textContent = 'Veuillez sélectionner un territoire';
        isValid = false;
      }

      return isValid;
    }

    // Handle form submission
    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (!validateForm()) {
        return;
      }

      const produit = document.getElementById('produit').value.trim();
      const territoire = document.getElementById('territoire').value;

      currentSearch = { produit, territoire };

      // Show loading
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      document.getElementById('suggestions').style.display = 'none';
      document.getElementById('no-results').style.display = 'none';

      try {
        // Call the API
        const response = await fetch(`/api/prices?territory=${encodeURIComponent(territoire)}&search=${encodeURIComponent(produit)}&limit=20`);
        const data = await response.json();

        document.getElementById('loading').style.display = 'none';

        if (data.items && data.items.length > 0) {
          currentResults = data.items;
          displayResults(data.items);
          showSuggestions(produit, territoire);
        } else {
          document.getElementById('no-results').style.display = 'block';
        }
      } catch (error) {
        console.error('Erreur lors de la recherche:', error);
        document.getElementById('loading').style.display = 'none';
        
        // Show demo results for testing
        const demoResults = generateDemoResults(produit, territoire);
        currentResults = demoResults;
        displayResults(demoResults);
        showSuggestions(produit, territoire);
      }
    });

    function generateDemoResults(produit, territoire) {
      const stores = ['Carrefour', 'Leader Price', 'Ecomax', 'Hyper U', 'Super U', 'Géant'];
      const results = [];
      
      for (let i = 0; i < Math.min(6, stores.length); i++) {
        const basePrice = 2.0 + Math.random() * 3;
        const pricePerUnit = basePrice + (Math.random() - 0.5) * 0.8;
        
        results.push({
          store: stores[i],
          name: produit,
          price: basePrice.toFixed(2),
          pricePerUnit: pricePerUnit.toFixed(2),
          unit: 'kg',
          territory: territoire,
          updatedAt: new Date().toISOString()
        });
      }
      
      return results.sort((a, b) => parseFloat(a.pricePerUnit) - parseFloat(b.pricePerUnit));
    }

    function displayResults(results) {
      const resultsList = document.getElementById('results-list');
      const resultsDiv = document.getElementById('results');
      
      resultsList.innerHTML = '';
      
      results.forEach((item, index) => {
        const isLowest = index === 0;
        const resultItem = document.createElement('div');
        resultItem.className = `result-item ${isLowest ? 'best-price' : ''}`;
        
        resultItem.innerHTML = `
          <div class="store-info">
            <h4>${item.store} ${isLowest ? '🏆' : ''}</h4>
            <p>${item.name}</p>
            <small>MAJ: ${new Date(item.updatedAt).toLocaleDateString('fr-FR')}</small>
          </div>
          <div class="price-info">
            <div>${item.price} €</div>
            <div class="price-per-unit">${item.pricePerUnit} €/${item.unit}</div>
          </div>
        `;
        
        resultsList.appendChild(resultItem);
      });
      
      resultsDiv.style.display = 'block';
    }

    function showSuggestions(produit, territoire) {
      const suggestions = [
        { name: `${produit} bio local`, reason: 'Alternative locale et bio' },
        { name: `${produit} en vrac`, reason: 'Moins d\'emballage, prix réduit' },
        { name: `Marque distributeur ${produit}`, reason: 'Souvent 20-30% moins cher' }
      ];

      const suggestionsList = document.getElementById('suggestions-list');
      suggestionsList.innerHTML = '';

      suggestions.forEach(suggestion => {
        const suggestionItem = document.createElement('div');
        suggestionItem.className = 'suggestion-item';
        suggestionItem.innerHTML = `
          <strong>💡 ${suggestion.name}</strong><br>
          <small>${suggestion.reason}</small>
        `;
        suggestionsList.appendChild(suggestionItem);
      });

      document.getElementById('suggestions').style.display = 'block';
    }

    // Export functions
    window.exportToExcel = () => {
      if (currentResults.length === 0) {
        alert('Aucun résultat à exporter');
        return;
      }

      // Create CSV content
      const headers = ['Enseigne', 'Produit', 'Prix', 'Prix/Unité', 'Unité', 'Territoire', 'Dernière MAJ'];
      const csvContent = [
        headers.join(','),
        ...currentResults.map(item => [
          item.store,
          item.name,
          item.price,
          item.pricePerUnit,
          item.unit,
          item.territory,
          new Date(item.updatedAt).toLocaleDateString('fr-FR')
        ].join(','))
      ].join('\n');

      // Download CSV
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', `comparaison_${currentSearch.produit}_${currentSearch.territoire}_${new Date().toISOString().split('T')[0]}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    window.exportToPDF = () => {
      alert('Export PDF en développement. Utilisez l\'export Excel pour le moment.');
    };

    window.shareResults = () => {
      if (navigator.share) {
        navigator.share({
          title: `Comparaison prix: ${currentSearch.produit}`,
          text: `Meilleur prix trouvé: ${currentResults[0]?.pricePerUnit}€/${currentResults[0]?.unit} chez ${currentResults[0]?.store}`,
          url: window.location.href
        });
      } else {
        // Fallback: copy to clipboard
        const text = `Comparaison prix ${currentSearch.produit} en ${currentSearch.territoire}\nMeilleur prix: ${currentResults[0]?.pricePerUnit}€/${currentResults[0]?.unit} chez ${currentResults[0]?.store}`;
        navigator.clipboard.writeText(text).then(() => {
          alert('Résultats copiés dans le presse-papier');
        });
      }
    };

    window.suggestProduct = () => {
      alert(`Merci pour votre suggestion! Le produit "${currentSearch.produit}" sera ajouté à notre base de données pour ${currentSearch.territoire}.`);
    };
  </script>

  <!-- Lazy Loading Support -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const images = document.querySelectorAll('img:not([loading])');
      images.forEach(img => {
        if (img.getBoundingClientRect().top > window.innerHeight * 2) {
          img.setAttribute('loading', 'lazy');
          img.setAttribute('decoding', 'async');
        }
      });
      
      const imagesWithoutAlt = document.querySelectorAll('img:not([alt])');
      imagesWithoutAlt.forEach(img => {
        const src = img.getAttribute('src') || '';
        const filename = src.split('/').pop().split('.')[0];
        img.setAttribute('alt', `Image: ${filename}`);
      });
    });
  </script>

  <!-- Lazy Loading Support -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Add lazy loading to images that don't have it
      const images = document.querySelectorAll('img:not([loading])');
      images.forEach(img => {
        if (img.getBoundingClientRect().top > window.innerHeight * 2) {
          img.setAttribute('loading', 'lazy');
          img.setAttribute('decoding', 'async');
        }
      });
      
      // Add alt attributes to images without them
      const imagesWithoutAlt = document.querySelectorAll('img:not([alt])');
      imagesWithoutAlt.forEach(img => {
        const src = img.getAttribute('src') || '';
        const filename = src.split('/').pop().split('.')[0];
        img.setAttribute('alt', `Image: ${filename}`);
      });
    });
  </script></body>
</html>
