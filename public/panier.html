<!doctype html><html lang="fr"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mon Panier — A KI PRI SA YÉ</title>
<link rel="stylesheet" href="/css/theme.css"/>
</head><body>
<div class="wrapper">
  <nav class="nav">
    <a href="/index.html">Accueil</a><a href="/avis.html">Avis</a><a href="/enseignes.html">Enseignes</a>
    <a href="/palmares.html">Palmarès</a><a href="/actualites.html">Actus</a><a href="/a-propos.html">À propos</a>
    <a href="/promos.html">Promos</a><button id="theme-toggle" class="theme-toggle btn">☀️ Clair</button>
    <a href="/tarifs.html">Tarifs</a>
</nav>

  <h1>Mon Panier</h1>
  <div class="card">
    <div class="toolbar">
      <input id="pName" class="input" placeholder="Nom du produit (ex. Lait 1L)">
      <input id="pPrice" class="input" type="number" step="0.01" placeholder="Prix (€)">
      <input id="pQty" class="input" type="number" step="1" value="1" min="1" placeholder="Qté">
      <input id="pBrand" class="input" placeholder="Enseigne (facultatif)">
      <input id="pTerr" class="input" placeholder="Territoire (ex. guadeloupe)">
      <button id="add" class="btn">Ajouter</button>
    </div>
    <div class="toolbar">
      <button id="clear" class="btn" style="background:#ffdd57;color:#2a2100">Vider le panier</button>
      <button id="export-json" class="btn">Exporter JSON</button>
      <button id="export-csv" class="btn">Exporter CSV</button>
    </div>
  </div>

  <div class="card" style="margin-top:12px;overflow:auto">
    <table id="tbl"><thead>
      <tr><th>Produit</th><th>Prix (€)</th><th>Qté</th><th>Enseigne</th><th>Territoire</th><th>Montant</th><th></th></tr>
    </thead><tbody></tbody></table>
  </div>

  <div class="card" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
    <div class="muted">Articles: <span id="count">0</span></div>
    <div style="font-weight:800">Total: <span id="total">0.00 €</span></div>
  </div>

  <pre id="out" class="card" style="margin-top:12px;white-space:pre-wrap;display:none"></pre>
</div>

<script src="/js/theme.js" defer></script>
<script>
const $=id=>document.getElementById(id), KEY="akp-cart-v1";
let CART=[];
function save(){localStorage.setItem(KEY,JSON.stringify(CART));}
function load(){try{CART=JSON.parse(localStorage.getItem(KEY)||"[]"); if(!Array.isArray(CART)) CART=[];}catch{CART=[]}}
function money(x){return (Number(x)||0).toFixed(2)}
function row(item,i){return \`<tr>
  <td>\${item.name}</td>
  <td><input data-i="\${i}" data-k="price" type="number" step="0.01" value="\${money(item.price)}" class="input" style="width:110px"></td>
  <td><input data-i="\${i}" data-k="qty" type="number" step="1" min="1" value="\${item.qty}" class="input" style="width:80px"></td>
  <td>\${item.brand||""}</td>
  <td>\${item.territory||""}</td>
  <td>\${money(item.price*item.qty)} €</td>
  <td><button data-i="\${i}" class="btn del" style="background:#ff7070;color:#2a0b0b">✕</button></td>
</tr>\`;}
function render(){
  const tb=document.querySelector('#tbl tbody');
  tb.innerHTML = CART.map(row).join('') || '<tr><td colspan="7" class="muted">Aucun article.</td></tr>';
  const total=CART.reduce((s,it)=>s+(Number(it.price)||0)*(Number(it.qty)||0),0);
  $('total').textContent=money(total)+' €';
  $('count').textContent=CART.reduce((s,it)=>s + Number(it.qty||0),0);
}
function add(){
  const it={name:$('pName').value.trim(),price:parseFloat($('pPrice').value||"0"),qty:parseInt($('pQty').value||"1"),brand:$('pBrand').value.trim(),territory:$('pTerr').value.trim()};
  if(!it.name || !(it.price>0) || !(it.qty>0)) return;
  CART.unshift(it); save(); render();
  ['pName','pPrice','pQty','pBrand','pTerr'].forEach(id=>$(id).value=id==='pQty'?'1':'');
}
function del(i){CART.splice(i,1); save(); render();}
function update(i,k,val){ if(k==='qty') val=parseInt(val||"1"); if(k==='price') val=parseFloat(val||"0"); CART[i][k]=val; save(); render(); }
function exportJSON(){const s=JSON.stringify({items:CART, total:CART.reduce((t,i)=>t+i.price*i.qty,0)},null,2); const out=$('out'); out.style.display='block'; out.textContent=s;}
function exportCSV(){const head=['product','price','qty','brand','territory']; const rows=CART.map(i=>[i.name, money(i.price), i.qty, i.brand||'', i.territory||'']); const csv=[head.join(','),...rows.map(r=>r.join(','))].join('\n'); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='panier.csv'; a.click();}
document.addEventListener('click',e=>{
  if(e.target.id==='add') add();
  if(e.target.classList?.contains('del')) del(parseInt(e.target.dataset.i));
});
document.addEventListener('change',e=>{
  const i=e.target.dataset?.i, k=e.target.dataset?.k; if(i!==undefined && k) update(parseInt(i),k,e.target.value);
});
$('clear').onclick=()=>{if(confirm('Vider le panier ?')){CART=[]; save(); render();}};
$('export-json').onclick=exportJSON;
$('export-csv').onclick=exportCSV;
load(); render();
</script>

<div id="site-footer"></div>
  <script src="/js/footer.js" defer></script>

  <!-- Lazy Loading Support -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Add lazy loading to images that don't have it
      const images = document.querySelectorAll('img:not([loading])');
      images.forEach(img => {
        if (img.getBoundingClientRect().top > window.innerHeight * 2) {
          img.setAttribute('loading', 'lazy');
          img.setAttribute('decoding', 'async');
        }
      });
      
      // Add alt attributes to images without them
      const imagesWithoutAlt = document.querySelectorAll('img:not([alt])');
      imagesWithoutAlt.forEach(img => {
        const src = img.getAttribute('src') || '';
        const filename = src.split('/').pop().split('.')[0];
        img.setAttribute('alt', `Image: ${filename}`);
      });
    });
  </script>
  <script>
    // Enhanced lazy loading with intersection observer and WebP support
    document.addEventListener('DOMContentLoaded', function() {
      // Native lazy loading support check
      if ('loading' in HTMLImageElement.prototype) {
        console.log('Native lazy loading supported');
      } else {
        // Load polyfill for browsers that don't support lazy loading
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/vanilla-lazyload@17.8.4/dist/lazyload.min.js';
        script.onload = () => {
          new LazyLoad({
            elements_selector: 'img[loading="lazy"]',
            use_native: false
          });
        };
        document.head.appendChild(script);
      }
      
      // WebP support detection
      function supportsWebP() {
        const canvas = document.createElement('canvas');
        canvas.width = 1;
        canvas.height = 1;
        return canvas.toDataURL('image/webp').indexOf('data:image/webp') === 0;
      }
      
      // Apply WebP fallback if needed
      if (!supportsWebP()) {
        const pictures = document.querySelectorAll('picture');
        pictures.forEach(picture => {
          const img = picture.querySelector('img');
          const webpSource = picture.querySelector('source[type="image/webp"]');
          if (webpSource && img) {
            webpSource.remove();
          }
        });
      }
    });
  </script></body></html>
