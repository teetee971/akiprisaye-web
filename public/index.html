<!doctype html><meta charset="utf-8">
<title>Test AKIPRI</title>
<h1>AKI PRI SA YÉ – test</h1>
<pre id="out">Chargement…</pre>
<script>
const ENDPOINT="https://us-central1-a-ki-pri-sa-ye.cloudfunctions.net/getRanking";
(async () => {
  try{
    const r=await fetch(ENDPOINT+"?zone=martinique");
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    document.getElementById('out').textContent = JSON.stringify(j,null,2);
  }catch(e){
    document.getElementById('out').textContent = "Erreur: "+e.message;
  }
})();
</script>
