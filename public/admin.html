<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - A KI PRI SA YÉ</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
        }
        
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }
        
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .tab-button {
            padding: 10px 20px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .tab-button.active {
            background: #007bff;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .upload-zone {
            border: 2px dashed #666;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            transition: border-color 0.3s;
        }
        
        .upload-zone.dragover {
            border-color: #007bff;
            background: rgba(0,123,255,0.1);
        }
        
        .ticket-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .ticket-card {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
        }
        
        .ticket-image {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .ocr-text {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #007bff;
            color: white;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn:hover {
            opacity: 0.8;
        }
        
        .input-field {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #666;
            border-radius: 5px;
            background: #333;
            color: #fff;
        }
        
        .status-message {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .status-success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }
        
        .status-error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }
        
        .status-info {
            background: rgba(0, 123, 255, 0.2);
            border: 1px solid #007bff;
            color: #007bff;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Configuration Firebase (utilise la même config que le projet principal)
        const firebaseConfig = {
            apiKey: "AIzaSyXXXXXXX",  // 🔐 À remplacer par ta clé réelle
            authDomain: "a-ki-pri-sa-ye.firebaseapp.com",
            projectId: "a-ki-pri-sa-ye",
            storageBucket: "a-ki-pri-sa-ye.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        // Initialisation Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        class AdminPanel {
            constructor() {
                this.currentUser = null;
                this.isAdmin = false;
                this.currentTab = 'ocr';
                this.init();
            }

            init() {
                this.render();
                this.setupEventListeners();
                
                // Écouter les changements d'authentification
                auth.onAuthStateChanged((user) => {
                    this.currentUser = user;
                    if (user) {
                        this.checkAdminRole();
                    } else {
                        this.isAdmin = false;
                        this.render();
                    }
                });
            }

            async checkAdminRole() {
                if (!this.currentUser) return;

                try {
                    // Vérifier le rôle admin via custom claims
                    const tokenResult = await this.currentUser.getIdTokenResult();
                    this.isAdmin = tokenResult.claims.admin === true || tokenResult.claims.role === 'admin';
                    
                    if (!this.isAdmin) {
                        // Vérifier également dans Firestore comme fallback
                        const userDoc = await db.collection('users').doc(this.currentUser.uid).get();
                        if (userDoc.exists) {
                            const userData = userDoc.data();
                            this.isAdmin = userData.role === 'admin';
                        }
                    }
                } catch (error) {
                    console.error('Erreur lors de la vérification du rôle admin:', error);
                    this.isAdmin = false;
                }

                this.render();
            }

            render() {
                const app = document.getElementById('app');
                
                if (!this.currentUser) {
                    app.innerHTML = this.renderLoginForm();
                } else if (!this.isAdmin) {
                    app.innerHTML = this.renderAccessDenied();
                } else {
                    app.innerHTML = this.renderAdminInterface();
                    this.setupTabListeners();
                    this.loadTickets();
                }
            }

            renderLoginForm() {
                return `
                    <div class="admin-container">
                        <div class="login-form">
                            <h2>🔐 Connexion Admin</h2>
                            <p>Connectez-vous pour accéder au panel d'administration</p>
                            
                            <input type="email" id="email" class="input-field" placeholder="Email" />
                            <input type="password" id="password" class="input-field" placeholder="Mot de passe" />
                            
                            <button onclick="adminPanel.login()" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                                Se connecter
                            </button>
                            
                            <div id="login-status"></div>
                        </div>
                    </div>
                `;
            }

            renderAccessDenied() {
                return `
                    <div class="admin-container">
                        <div class="login-form">
                            <h2>❌ Accès refusé</h2>
                            <p>Vous n'avez pas les droits d'administration nécessaires.</p>
                            <p>Utilisateur connecté: ${this.currentUser.email}</p>
                            
                            <button onclick="adminPanel.logout()" class="btn btn-danger" style="width: 100%; margin-top: 20px;">
                                Se déconnecter
                            </button>
                        </div>
                    </div>
                `;
            }

            renderAdminInterface() {
                return `
                    <div class="admin-container">
                        <div class="admin-header">
                            <h1>🎯 Panel Admin - A KI PRI SA YÉ</h1>
                            <div>
                                <span>👤 ${this.currentUser.email}</span>
                                <button onclick="adminPanel.logout()" class="btn btn-danger" style="margin-left: 10px;">
                                    Déconnexion
                                </button>
                            </div>
                        </div>

                        <div class="admin-tabs">
                            <button class="tab-button ${this.currentTab === 'ocr' ? 'active' : ''}" 
                                    onclick="adminPanel.switchTab('ocr')">
                                🧠 OCR Tickets
                            </button>
                            <button class="tab-button ${this.currentTab === 'analytics' ? 'active' : ''}" 
                                    onclick="adminPanel.switchTab('analytics')">
                                📊 Analytics
                            </button>
                            <button class="tab-button ${this.currentTab === 'settings' ? 'active' : ''}" 
                                    onclick="adminPanel.switchTab('settings')">
                                ⚙️ Paramètres
                            </button>
                        </div>

                        <div class="tab-content ${this.currentTab === 'ocr' ? 'active' : ''}" id="ocr-tab">
                            ${this.renderOCRTab()}
                        </div>

                        <div class="tab-content ${this.currentTab === 'analytics' ? 'active' : ''}" id="analytics-tab">
                            ${this.renderAnalyticsTab()}
                        </div>

                        <div class="tab-content ${this.currentTab === 'settings' ? 'active' : ''}" id="settings-tab">
                            ${this.renderSettingsTab()}
                        </div>
                    </div>
                `;
            }

            renderOCRTab() {
                return `
                    <h3>📸 Upload et analyse de tickets</h3>
                    
                    <div class="upload-zone" id="upload-zone">
                        <p>📁 Glissez-déposez vos images de tickets ici ou cliquez pour sélectionner</p>
                        <input type="file" id="file-input" accept="image/*" multiple style="display: none;" />
                        <button onclick="document.getElementById('file-input').click()" class="btn btn-primary">
                            Choisir des fichiers
                        </button>
                    </div>
                    
                    <div id="upload-status"></div>
                    
                    <h4>📋 Tickets analysés récemment</h4>
                    <div id="tickets-container" class="ticket-grid">
                        <div class="loading"></div> Chargement des tickets...
                    </div>
                `;
            }

            renderAnalyticsTab() {
                return `
                    <h3>📊 Statistiques d'utilisation</h3>
                    <div id="analytics-content">
                        <p>Statistiques en cours de développement...</p>
                    </div>
                `;
            }

            renderSettingsTab() {
                return `
                    <h3>⚙️ Paramètres système</h3>
                    <div id="settings-content">
                        <p>Configuration en cours de développement...</p>
                    </div>
                `;
            }

            setupEventListeners() {
                // Les événements spécifiques seront configurés dans setupTabListeners
            }

            setupTabListeners() {
                const fileInput = document.getElementById('file-input');
                const uploadZone = document.getElementById('upload-zone');

                if (fileInput && uploadZone) {
                    fileInput.addEventListener('change', (e) => this.handleFileUpload(e.target.files));
                    
                    uploadZone.addEventListener('click', () => fileInput.click());
                    
                    // Drag & Drop
                    uploadZone.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        uploadZone.classList.add('dragover');
                    });
                    
                    uploadZone.addEventListener('dragleave', () => {
                        uploadZone.classList.remove('dragover');
                    });
                    
                    uploadZone.addEventListener('drop', (e) => {
                        e.preventDefault();
                        uploadZone.classList.remove('dragover');
                        this.handleFileUpload(e.dataTransfer.files);
                    });
                }
            }

            async login() {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const statusDiv = document.getElementById('login-status');

                if (!email || !password) {
                    statusDiv.innerHTML = '<div class="status-message status-error">Veuillez remplir tous les champs</div>';
                    return;
                }

                try {
                    statusDiv.innerHTML = '<div class="status-message status-info">Connexion en cours...</div>';
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (error) {
                    console.error('Erreur de connexion:', error);
                    statusDiv.innerHTML = `<div class="status-message status-error">Erreur: ${error.message}</div>`;
                }
            }

            async logout() {
                try {
                    await auth.signOut();
                } catch (error) {
                    console.error('Erreur de déconnexion:', error);
                }
            }

            switchTab(tabName) {
                this.currentTab = tabName;
                this.render();
            }

            async handleFileUpload(files) {
                const statusDiv = document.getElementById('upload-status');
                statusDiv.innerHTML = '';

                for (let file of files) {
                    if (!file.type.startsWith('image/')) {
                        statusDiv.innerHTML += `<div class="status-message status-error">❌ ${file.name} n'est pas une image</div>`;
                        continue;
                    }

                    try {
                        statusDiv.innerHTML += `<div class="status-message status-info">🔄 Analyse de ${file.name}...</div>`;
                        
                        const result = await this.processOCR(file);
                        await this.saveTicketToFirestore(file, result);
                        
                        statusDiv.innerHTML += `<div class="status-message status-success">✅ ${file.name} traité avec succès</div>`;
                        
                        // Recharger la liste des tickets
                        this.loadTickets();
                        
                    } catch (error) {
                        console.error('Erreur lors du traitement:', error);
                        statusDiv.innerHTML += `<div class="status-message status-error">❌ Erreur lors du traitement de ${file.name}: ${error.message}</div>`;
                    }
                }
            }

            async processOCR(file) {
                return new Promise((resolve, reject) => {
                    Tesseract.recognize(file, 'fra', {
                        logger: (m) => console.log('OCR Progress:', m)
                    }).then(({ data: { text, confidence } }) => {
                        resolve({
                            text,
                            confidence,
                            processedAt: new Date()
                        });
                    }).catch(reject);
                });
            }

            async saveTicketToFirestore(file, ocrResult) {
                // Convertir l'image en base64 pour stockage
                const imageBase64 = await this.fileToBase64(file);
                
                const ticketData = {
                    fileName: file.name,
                    fileSize: file.size,
                    fileType: file.type,
                    imageData: imageBase64,
                    ocrText: ocrResult.text,
                    ocrConfidence: ocrResult.confidence,
                    uploadedBy: this.currentUser.uid,
                    uploadedByEmail: this.currentUser.email,
                    uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    processedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                const docRef = await db.collection('tickets').add(ticketData);
                console.log('Ticket sauvegardé avec ID:', docRef.id);
                
                return docRef.id;
            }

            async loadTickets() {
                const container = document.getElementById('tickets-container');
                if (!container) return;

                try {
                    const snapshot = await db.collection('tickets')
                        .orderBy('uploadedAt', 'desc')
                        .limit(20)
                        .get();

                    if (snapshot.empty) {
                        container.innerHTML = '<p>Aucun ticket analysé pour le moment.</p>';
                        return;
                    }

                    let html = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        html += this.renderTicketCard(doc.id, data);
                    });

                    container.innerHTML = html;
                } catch (error) {
                    console.error('Erreur lors du chargement des tickets:', error);
                    container.innerHTML = '<div class="status-message status-error">Erreur lors du chargement des tickets</div>';
                }
            }

            renderTicketCard(id, data) {
                const uploadDate = data.uploadedAt ? data.uploadedAt.toDate().toLocaleString('fr-FR') : 'Date inconnue';
                
                return `
                    <div class="ticket-card">
                        <img src="${data.imageData}" alt="${data.fileName}" class="ticket-image" />
                        <h4>📄 ${data.fileName}</h4>
                        <p><strong>📅 Uploadé:</strong> ${uploadDate}</p>
                        <p><strong>👤 Par:</strong> ${data.uploadedByEmail}</p>
                        <p><strong>🎯 Confiance OCR:</strong> ${Math.round(data.ocrConfidence)}%</p>
                        
                        <details>
                            <summary>📝 Texte extrait</summary>
                            <div class="ocr-text">${data.ocrText}</div>
                        </details>
                        
                        <button onclick="adminPanel.deleteTicket('${id}')" class="btn btn-danger" style="margin-top: 10px;">
                            🗑️ Supprimer
                        </button>
                    </div>
                `;
            }

            async deleteTicket(ticketId) {
                if (!confirm('Êtes-vous sûr de vouloir supprimer ce ticket ?')) {
                    return;
                }

                try {
                    await db.collection('tickets').doc(ticketId).delete();
                    this.loadTickets(); // Recharger la liste
                } catch (error) {
                    console.error('Erreur lors de la suppression:', error);
                    alert('Erreur lors de la suppression du ticket');
                }
            }

            fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                });
            }
        }

        // Initialisation de l'application admin
        const adminPanel = new AdminPanel();
    </script>
</body>
</html>
