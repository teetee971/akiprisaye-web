<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recherche produit – A KI PRI SA YÉ</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Recherchez un produit et trouvez son prix par enseigne dans votre zone." />

  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --muted:#94a3b8;
      --text:#e5e7eb; --brand:#38bdf8; --brand-dark:#0ea5e9;
      --ok:#22c55e; --err:#ef4444; --card:#1e293b;
    }
    *{box-sizing:border-box}
    html,body{margin:0; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;}
    a{color:var(--brand); text-decoration:none}
    header{
      padding:2rem 1rem; background:linear-gradient(180deg, rgba(2,6,23,.6), rgba(2,6,23,0));
      text-align:center;
    }
    .wrap{max-width:980px; margin:0 auto; padding:0 1rem}
    h1{margin:0 0 .25rem 0; font-size:clamp(1.4rem, 2.5vw, 2rem);}
    .sub{color:var(--muted); margin:0}
    .card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px; padding:1rem;
      backdrop-filter: blur(6px);
    }
    .panel{ margin:1rem 0 2rem 0 }
    label{display:block; margin:.25rem 0 .4rem 0; color:var(--muted)}
    select, input[type="text"]{
      width:100%; background:var(--card); color:var(--text);
      border:1px solid rgba(255,255,255,.12); border-radius:10px;
      padding:.9rem .9rem; outline:none;
    }
    .row{display:grid; gap:1rem}
    @media(min-width:700px){ .row{ grid-template-columns: 260px 1fr 160px } }

    .btn{
      display:inline-block; width:100%;
      background:linear-gradient(90deg, var(--brand), var(--brand-dark));
      border:none; color:#001018; font-weight:700; letter-spacing:.2px;
      padding:.95rem 1rem; border-radius:12px; cursor:pointer;
    }
    .status{margin:.6rem 0 0 0; font-size:.95rem}
    .status.ok{ color:var(--ok) }
    .status.err{ color:var(--err) }
    .status.muted{ color:var(--muted) }

    .cards{ display:grid; gap:1rem; margin-top:1rem }
    @media(min-width:700px){ .cards{ grid-template-columns: 1fr 1fr } }
    .item h3{ margin:.1rem 0 .35rem 0; font-size:1.1rem; color:var(--brand) }
    .meta{ margin:.15rem 0; color:var(--muted) }
    .price{ font-size:1.05rem; font-weight:700; margin:.15rem 0; }
    footer{ text-align:center; color:var(--muted); padding:2rem 0; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>🔎 Recherche produit</h1>
      <p class="sub">Tape un mot-clé (ex : <i>banane</i>, <i>yaourt</i>, <i>lait</i>, <i>baguette</i>…) et choisis ta zone.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card panel">
      <div class="row">
        <div>
          <label for="zone">Zone</label>
          <select id="zone">
            <option value="martinique">Martinique</option>
            <option value="guadeloupe">Guadeloupe</option>
            <option value="guyane">Guyane</option>
            <option value="reunion">La Réunion</option>
            <option value="mayotte">Mayotte</option>
            <option value="saint-martin">Saint-Martin</option>
            <option value="saint-barthelemy">Saint-Barthélemy</option>
            <option value="saint-pierre-et-miquelon">Saint-Pierre-et-Miquelon</option>
            <option value="polynesie-francaise">Polynésie française</option>
            <option value="wallis-et-futuna">Wallis-et-Futuna</option>
          </select>
        </div>

        <div>
          <label for="q">Produit</label>
          <input id="q" type="text" placeholder="Ex : banane, yaourt nature, lait demi-écrémé…" />
        </div>

        <div style="align-self:end">
          <button id="go" class="btn">Rechercher</button>
        </div>
      </div>

      <div id="status" class="status muted">Saisissez un mot-clé puis cliquez sur « Rechercher ».</div>
      <div id="count" class="status muted"></div>
    </section>

    <section id="results" class="cards"></section>
  </main>

  <footer>
    <div class="wrap">© <span id="y"></span> A KI PRI SA YÉ</div>
  </footer>

  <script>
    // 1) Endpoint de la Cloud Function de recherche
    const SEARCH_ENDPOINT = "https://us-central1-a-ki-pri-sa-ye.cloudfunctions.net/searchPrices";

    // 2) Utilitaires
    const fmtEUR = new Intl.NumberFormat("fr-FR", { style:"currency", currency:"EUR" });
    const $ = (sel) => document.querySelector(sel);
    const statusEl = $("#status");
    const countEl  = $("#count");
    const listEl   = $("#results");

    function setStatus(text, type="muted"){
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    function setCount(n, zone, q){
      if(n==null){ countEl.textContent = ""; return; }
      countEl.textContent = `${n} résultat${n>1?"s":""} pour « ${q} » – zone ${zone}`;
    }

    function niceDate(ts){
      try{
        if(!ts) return "-";
        if(typeof ts === "number") return new Date(ts).toLocaleDateString("fr-FR");
        if(ts._seconds) return new Date(ts._seconds*1000).toLocaleDateString("fr-FR");
        if(ts.seconds)  return new Date(ts.seconds*1000).toLocaleDateString("fr-FR");
        const d = new Date(ts);
        return isNaN(d.getTime()) ? "-" : d.toLocaleDateString("fr-FR");
      }catch{ return "-"; }
    }

    // 3) Rendu visuel
    function render(items){
      if(!items || items.length===0){
        listEl.innerHTML = `<div class="card item"><h3>Aucun résultat</h3><div class="meta">Essayez un autre mot-clé.</div></div>`;
        setCount(0);
        return;
      }

      listEl.innerHTML = items.map(it => {
        const name  = it.name || it.product || it.label || "Produit";
        const shop  = it.store || it.shop || it.brand || "Enseigne inconnue";
        const prix  = (it.price ?? it.amount ?? null);
        const unit  = it.unit || it.unitPrice || "";
        const maj   = niceDate(it.updatedAt || it.ts);

        return `
          <article class="card item">
            <h3>${name}</h3>
            <div class="price">${prix != null ? fmtEUR.format(prix) : "—"} ${unit ? " / "+unit : ""}</div>
            <div class="meta"><b>Enseigne :</b> ${shop}</div>
            <div class="meta"><b>Maj :</b> ${maj}</div>
          </article>
        `;
      }).join("");
      setCount(items.length, $("#zone").value, $("#q").value.trim());
    }

    // 4) Appel API
    async function doSearch(){
      const zone = $("#zone").value;
      const q    = $("#q").value.trim();

      if(!q){ setStatus("Entrez un mot-clé.", "err"); listEl.innerHTML = ""; setCount(null); return; }

      // cache-busting léger (évite un vieux cache éventuel en Pages)
      const v = Date.now().toString().slice(-6);
      const url = `${SEARCH_ENDPOINT}?zone=${encodeURIComponent(zone)}&q=${encodeURIComponent(q)}&limit=24&v=${v}`;

      setStatus("Recherche en cours…", "muted");

      try{
        const res = await fetch(url, { headers:{ "accept":"application/json" }});
        if(!res.ok) throw new Error("HTTP "+res.status);
        const data = await res.json();

        if(!data || !Array.isArray(data.items)){ render([]); setStatus("Aucun résultat.", "muted"); return; }

        render(data.items);
        setStatus("Résultats mis à jour.", "ok");
      }catch(e){
        console.error(e);
        setStatus("Erreur : impossible de charger les résultats.", "err");
      }
    }

    // 5) Événements
    $("#go").addEventListener("click", doSearch);
    $("#q").addEventListener("keydown", (e)=>{ if(e.key==="Enter") doSearch(); });

    // Année footer
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
<script>
const SEARCH_ENDPOINT = "https://us-central1-a-ki-pri-sa-ye.cloudfunctions.net/searchPrices";

// récupère les éléments du DOM
const zoneEl   = document.getElementById("zone");
const qEl      = document.getElementById("q");
const goEl     = document.getElementById("go");
const listEl   = document.getElementById("list");
const statusEl = document.getElementById("status");

// fonction pour afficher les résultats
function render(items) {
  if (!items || items.length === 0) {
    listEl.innerHTML = `<div class="status muted">Aucun résultat trouvé.</div>`;
    return;
  }

  // construire les lignes HTML du tableau
  listEl.innerHTML = items.map(it => `
    <tr>
      <td><img src="${it.image || ''}" alt="img" style="max-height:40px"></td>
      <td>${it.name || '-'}</td>
      <td>${it.brand || '-'}</td>
      <td>${it.price ? it.price + ' ' + (it.currency||'') : '-'}</td>
      <td>${it.quantity || '-'}</td>
    </tr>
  `).join("");
}

// fonction pour lancer la recherche
async function search() {
  const zone = zoneEl.value;
  const text = qEl.value.trim();

  if (!text) {
    statusEl.textContent = "⚠️ Entrez un produit.";
    statusEl.className = "status err";
    return;
  }

  statusEl.textContent = "Recherche en cours…";
  statusEl.className = "status muted";

  const v = Date.now().toString().slice(-6); // anti-cache
  const url = `${SEARCH_ENDPOINT}?zone=${encodeURIComponent(zone)}&q=${encodeURIComponent(text)}&limit=10&v=${v}`;

  try {
    const res = await fetch(url, { headers: { "accept": "application/json" }});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    render(data.items || []);
    statusEl.textContent = `✅ ${data.count || 0} résultats trouvés`;
    statusEl.className = "status ok";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "❌ Erreur lors de la recherche";
    statusEl.className = "status err";
  }
}

// brancher les événements
goEl.addEventListener("click", search);
qEl.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
</script>
</html>
