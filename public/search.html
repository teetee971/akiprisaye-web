<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>A KI PRI SA YÉ — Recherche produit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    :root{
      --bg:#0d1420;--panel:#1b2636;--muted:#8da2b5;--text:#e8f0f7;--accent:#35e1ff;
      --ok:#18c08f;--err:#ff6b6b;--shadow:0 6px 24px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
    a{color:var(--accent);text-decoration:none}
    .wrap{max-width:980px;margin:24px auto;padding:0 16px}
    header{padding:24px 0 12px}
    h1{margin:0 0 8px;font-size:32px;letter-spacing:.5px}
    .sub{color:var(--muted)}
    nav{display:flex;gap:16px;margin:16px 0 24px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:14px 18px;border-radius:12px;background:var(--accent);color:#042029;
      font-weight:700;border:0;cursor:pointer;box-shadow:var(--shadow);
    }
    .btn.secondary{background:#223147;color:var(--text)}
    .card{
      background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;
    }
    .row{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:640px){.row{grid-template-columns:260px 1fr}}
    label{display:block;margin:6px 0 6px;color:var(--muted);font-size:14px}
    select,input,button{width:100%}
    select,input{
      background:#0f1826;border:1px solid #2b3a52;color:var(--text);
      border-radius:10px;padding:12px 12px;outline:none;
    }
    #go{margin-top:10px}
    .status{margin:6px 0 0;font-size:14px}
    .status.muted{color:var(--muted)}
    .status.ok{color:var(--ok)}
    .status.err{color:var(--err)}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:10px;border-bottom:1px solid #2b3a52;text-align:left}
    th{color:var(--muted);font-weight:600;font-size:14px}
    tfoot td{color:var(--muted)}
    .img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:#0f1826;border:1px solid #23324a}
    .right{text-align:right}
    footer{color:var(--muted);font-size:14px;margin:28px 0 40px}
    .modal{backdrop-filter:blur(4px)}
    .modal-content{animation:fadeIn 0.2s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
    textarea{font-family:inherit;line-height:1.4}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
  </style>
<link rel="stylesheet" href="/app-modal.css"/>
  <link rel="stylesheet" href="/css/theme.css"/>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>A KI PRI SA YÉ</h1>
      <div class="sub">Comparez les prix, suivez votre budget et trouvez l’enseigne la moins chère.</div>
      <nav>
        <a class="btn secondary" href="./index.html">🏠 Accueil</a>
        <a class="btn" href="#">🔎 Recherche</a>
      </nav>
    </header>

    <section class="card">
      <h2 style="margin:0 0 12px">🔎 Recherche produit</h2>

      <div class="row">
        <div>
          <label for="zone">Zone</label>
          <select id="zone">
            <option value="martinique">Martinique</option>
            <option value="guadeloupe">Guadeloupe</option>
            <option value="guyane">Guyane</option>
            <option value="reunion">La Réunion</option>
            <option value="mayotte">Mayotte</option>
          </select>
        </div>
        <div>
          <label for="q">Produit</label>
          <input id="q" placeholder="ex : Lait, Banane, Riz…" inputmode="search"/>
          <button id="go" type="button" class="btn">Rechercher</button>
          <div id="status" class="status muted">Saisissez un mot-clé puis cliquez sur « Rechercher ».</div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Produit</th>
            <th>Enseigne</th>
            <th class="right">Prix</th>
            <th>Unité</th>
            <th>Maj.</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="out"></tbody>
        <tfoot>
          <tr><td colspan="6" id="hint">—</td></tr>
        </tfoot>
      </table>
    </section>

    <footer>© <span id="y"></span> A KI PRI SA YÉ</footer>
  </div>

  <!-- Report Modal -->
  <div id="reportModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000">
    <div class="modal-content" style="background:var(--panel);margin:5% auto;padding:20px;border-radius:16px;width:90%;max-width:500px;box-shadow:var(--shadow)">
      <h3 style="margin:0 0 16px;color:var(--text)">Signaler un produit</h3>
      <div style="margin-bottom:12px">
        <label for="reportReason" style="display:block;margin-bottom:4px;color:var(--muted)">Raison du signalement</label>
        <select id="reportReason" style="width:100%;background:#0f1826;border:1px solid #2b3a52;color:var(--text);border-radius:10px;padding:12px">
          <option value="prix_incorrect">Prix incorrect</option>
          <option value="produit_indisponible">Produit indisponible</option>
          <option value="information_incorrecte">Information incorrecte</option>
          <option value="contenu_inapproprie">Contenu inapproprié</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div style="margin-bottom:16px">
        <label for="reportComment" style="display:block;margin-bottom:4px;color:var(--muted)">Commentaire (optionnel)</label>
        <textarea id="reportComment" placeholder="Décrivez le problème..." style="width:100%;height:80px;background:#0f1826;border:1px solid #2b3a52;color:var(--text);border-radius:10px;padding:12px;resize:vertical"></textarea>
      </div>
      <div style="display:flex;gap:12px;justify-content:flex-end">
        <button id="cancelReport" class="btn secondary">Annuler</button>
        <button id="submitReport" class="btn">Envoyer</button>
      </div>
      <div id="reportStatus" class="status muted" style="margin-top:12px"></div>
    </div>
  </div>

  <script>
    // 0) Constantes
    const SEARCH_ENDPOINT = "https://us-central1-a-ki-pri-sa-ye.cloudfunctions.net/searchPrices";

    // 1) Petits utilitaires DOM
    const $ = (sel) => document.querySelector(sel);
    const zoneEl = $("#zone"), qEl = $("#q"), goEl = $("#go"), outEl = $("#out"), stEl = $("#status"), hintEl = $("#hint");

    function setStatus(msg, cls=""){
      stEl.className = "status " + (cls||"muted");
      stEl.textContent = msg;
    }

    function render(items){
      outEl.innerHTML = items.map((it, index) => `
        <tr>
          <td><div style="display:flex;align-items:center;gap:10px">
            ${it.image ? `<img loading="lazy" decoding="async" class="img" src="${it.image}" alt="">` : ""}
            <div>
              <div style="font-weight:600">${it.name||"-"}</div>
              <div style="color:#8da2b5;font-size:12px">${it.brand||""}</div>
            </div>
          </div></td>
          <td>${it.store||""}</td>
          <td class="right">${(it.price!=null? it.price.toFixed(2)+" "+(it.currency||"€") : "—")}</td>
          <td>${it.quantity? it.quantity : (it.unit||"")}</td>
          <td>${it.updatedAt? new Date(it.updatedAt*1000).toLocaleDateString("fr-FR") : "—"}</td>
          <td><button class="btn-report" data-product-index="${index}" style="background:#ff6b6b;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px">Signaler</button></td>
        </tr>
      `).join("");
      hintEl.textContent = items.length ? `${items.length} résultat(s)` : "Aucun résultat.";
      
      // Wire up report buttons
      document.querySelectorAll('.btn-report').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const index = parseInt(e.target.getAttribute('data-product-index'));
          const product = items[index];
          openReportModal(product);
        });
      });
    }

    // 2) Fonction de recherche
    async function doSearch(){
      const zone = (zoneEl.value||"").trim().toLowerCase();
      const text = (qEl.value||"").trim();
      if(!text){ setStatus("Entrez un mot-clé.","err"); qEl.focus(); return; }

      // anti-cache léger
      const v = Date.now().toString().slice(-6);
      const url = `${SEARCH_ENDPOINT}?zone=${encodeURIComponent(zone)}&q=${encodeURIComponent(text)}&limit=25&v=${v}`;

      setStatus("Recherche en cours…","muted");
      render([]);

      try{
        const r = await fetch(url, { headers:{ accept:"application/json" }});
        if(!r.ok) throw new Error("HTTP "+r.status);
        const data = await r.json();
        render(data.items||[]);
        setStatus("Résultats mis à jour.","ok");
      }catch(e){
        console.error(e);
        // Show demo data when API fails
        const demoData = [
          {
            name: "Banane " + text,
            brand: "Bio",
            store: "Carrefour Génipa",
            price: 2.45,
            currency: "€",
            unit: "kg",
            updatedAt: Math.floor(Date.now()/1000) - 86400
          },
          {
            name: "Banane " + text + " premium",
            brand: "Extra",
            store: "Hyper U Place d'Armes",
            price: 2.19,
            currency: "€", 
            unit: "kg",
            updatedAt: Math.floor(Date.now()/1000) - 172800
          },
          {
            name: "Banane " + text + " locale",
            brand: "",
            store: "Market Fresh",
            price: 1.95,
            currency: "€",
            unit: "kg", 
            updatedAt: Math.floor(Date.now()/1000) - 259200
          }
        ];
        render(demoData);
        setStatus("Données de démonstration (API indisponible)","ok");
      }
    }

    // 3) Évènements
    goEl.addEventListener("click", doSearch);
    qEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doSearch(); });

    // 4) Fallback global (si on a un vieux onclick inline)
    window.doSearch = doSearch;

    // 5) Petite UX : focus auto + année footer
    qEl.setAttribute("autocomplete","on");
    $("#y").textContent = new Date().getFullYear();

    // 6) Report Modal functionality
    let currentProduct = null;
    const reportModal = $("#reportModal");
    const reportReason = $("#reportReason");
    const reportComment = $("#reportComment");
    const reportStatus = $("#reportStatus");
    const cancelReport = $("#cancelReport");
    const submitReport = $("#submitReport");

    function openReportModal(product) {
      currentProduct = product;
      reportReason.value = "prix_incorrect";
      reportComment.value = "";
      setReportStatus("", "muted");
      reportModal.style.display = "block";
    }

    function closeReportModal() {
      reportModal.style.display = "none";
      currentProduct = null;
    }

    function setReportStatus(msg, cls = "muted") {
      reportStatus.className = "status " + cls;
      reportStatus.textContent = msg;
    }

    async function submitProductReport() {
      if (!currentProduct) return;

      const reason = reportReason.value;
      const comment = reportComment.value.trim();

      if (!reason) {
        setReportStatus("Veuillez sélectionner une raison.", "err");
        return;
      }

      setReportStatus("Envoi du signalement...", "muted");
      submitReport.disabled = true;

      const reportData = {
        product: {
          name: currentProduct.name,
          store: currentProduct.store,
          price: currentProduct.price,
          zone: zoneEl.value
        },
        reason: reason,
        comment: comment,
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent
      };

      try {
        // Send to Firebase Cloud Function
        const response = await fetch('https://us-central1-a-ki-pri-sa-ye.cloudfunctions.net/submitProductReport', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(reportData)
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();
        
        if (result.success) {
          setReportStatus("Signalement envoyé avec succès !", "ok");
          setTimeout(() => {
            closeReportModal();
          }, 2000);
        } else {
          throw new Error(result.error || 'Unknown error');
        }
      } catch (error) {
        console.error('Error submitting report:', error);
        // Fallback to localStorage if Firebase fails
        try {
          const reports = JSON.parse(localStorage.getItem('akp-reports') || '[]');
          reports.push(reportData);
          localStorage.setItem('akp-reports', JSON.stringify(reports));
          setReportStatus("Signalement stocké localement (hors ligne).", "ok");
          setTimeout(() => {
            closeReportModal();
          }, 2000);
        } catch (localError) {
          setReportStatus("Erreur lors de l'envoi du signalement.", "err");
        }
      } finally {
        submitReport.disabled = false;
      }
    }

    // Modal events
    cancelReport.addEventListener("click", closeReportModal);
    submitReport.addEventListener("click", submitProductReport);
    
    // Close modal when clicking outside
    reportModal.addEventListener("click", (e) => {
      if (e.target === reportModal) {
        closeReportModal();
      }
    });

    // Close modal with Escape key
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && reportModal.style.display === "block") {
        closeReportModal();
      }
    });
  </script>
<script type="module">import {wireProductClicks} from "/app-modal.js";
window.wireProductClicks=wireProductClicks;</script>

<div id="site-footer"></div>
  <script src="/js/footer.js" defer></script>
</body>
</html>
