<body>
<nav class="nav"><div class="container" style="display:flex;justify-content:space-between;align-items:center">
  <a href="/" class="brand">A KI PRI SA YÉ</a>
  <a href="/" class="badge">Accueil</a>
</div></nav>

<main class="container section">
  <h1>Résultats</h1>
  <p class="lead" id="qtxt"></p>
  <div id="results" class="grid"></div>
</main>

<script>
const qs=new URLSearchParams(location.search); const q=qs.get('q')||''; const t=qs.get('t')||'';
document.getElementById('qtxt').textContent=`Recherche : "${q}" ${t?('· Territoire : '+t):''}`;

async function demoResults(){
  // Démo : fabrique 6 résultats fictifs
  const items = Array.from({length:6}).map((_,i)=>({
    name:`Produit ${i+1} — ${q||'exemple'}`,
    price:(2.3+i/3).toFixed(2).replace('.',',')+' €',
    store:['U','Carrefour','Leader'][i%3],
    badge:(/^\d{8,14}$/.test(q)?'EAN détecté':'Texte')
  }));
  const wrap=document.createElement('div');
  items.forEach(p=>{
    const card=document.createElement('article');card.className='card';
    card.innerHTML=`<span class="badge">${p.badge}</span>
      <h3>${p.name}</h3><p class="lead">${p.store}</p>
      <strong style="font-size:20px;color:#22c55e">${p.price}</strong>`;
    wrap.appendChild(card);
  });
  document.getElementById('results').replaceChildren(...wrap.children);
}
demoResults();
</script>

<div id="site-footer"></div>
  <script src="/js/footer.js" defer></script>

  <!-- Lazy Loading Support -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Add lazy loading to images that don't have it
      const images = document.querySelectorAll('img:not([loading])');
      images.forEach(img => {
        if (img.getBoundingClientRect().top > window.innerHeight * 2) {
          img.setAttribute('loading', 'lazy');
          img.setAttribute('decoding', 'async');
        }
      });
      
      // Add alt attributes to images without them
      const imagesWithoutAlt = document.querySelectorAll('img:not([alt])');
      imagesWithoutAlt.forEach(img => {
        const src = img.getAttribute('src') || '';
        const filename = src.split('/').pop().split('.')[0];
        img.setAttribute('alt', `Image: ${filename}`);
      });
    });
  </script>
  <script>
    // Enhanced lazy loading with intersection observer and WebP support
    document.addEventListener('DOMContentLoaded', function() {
      // Native lazy loading support check
      if ('loading' in HTMLImageElement.prototype) {
        console.log('Native lazy loading supported');
      } else {
        // Load polyfill for browsers that don't support lazy loading
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/vanilla-lazyload@17.8.4/dist/lazyload.min.js';
        script.onload = () => {
          new LazyLoad({
            elements_selector: 'img[loading="lazy"]',
            use_native: false
          });
        };
        document.head.appendChild(script);
      }
      
      // WebP support detection
      function supportsWebP() {
        const canvas = document.createElement('canvas');
        canvas.width = 1;
        canvas.height = 1;
        return canvas.toDataURL('image/webp').indexOf('data:image/webp') === 0;
      }
      
      // Apply WebP fallback if needed
      if (!supportsWebP()) {
        const pictures = document.querySelectorAll('picture');
        pictures.forEach(picture => {
          const img = picture.querySelector('img');
          const webpSource = picture.querySelector('source[type="image/webp"]');
          if (webpSource && img) {
            webpSource.remove();
          }
        });
      }
    });
  </script></body>
</html>
