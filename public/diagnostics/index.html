<!doctype html>
<html lang="fr">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Diagnostics A KI PRI SA YÉ</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;margin:0 auto;max-width:920px;padding:24px}
  h1{font-size:1.6rem;margin:0 0 8px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .card{border:1px solid #8883;padding:14px;border-radius:12px;background:#fff2}
  .ok{color:#16a34a;font-weight:600}
  .ko{color:#dc2626;font-weight:600}
  code,pre{background:#0002;padding:.2em .35em;border-radius:.4em}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  small{opacity:.7}
</style>
<h1>Diagnostics</h1>
<p>Statut en direct des endpoints. <small>Cache-buster: <span id="ts" class="mono"></span></small></p>
<div class="grid">
  <div class="card"><h3>Page</h3><div id="page"></div></div>
  <div class="card"><h3>version.txt</h3><div id="version"></div></div>
  <div class="card"><h3>API /territories</h3><div id="territories"></div></div>
  <div class="card"><h3>API /prices</h3><div id="prices"></div></div>
</div>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const ts = Date.now(); $("ts").textContent = ts;

  async function check(url, parser){
    try{
      const r = await fetch(url,{cache:"no-store"});
      const ok = r.ok;
      const body = await r.text();
      const data = parser ? parser(body) : null;
      return {ok, code:r.status, data, body};
    }catch(e){ return {ok:false, code:"ERR", data:null, body:String(e)}}
  }
  const origin = location.origin;

  const page = await check(origin + "/?v="+ts);
  $("page").innerHTML = page.ok
    ? `<span class="ok">OK</span> HTTP ${page.code}`
    : `<span class="ko">KO</span> (${page.code})`;

  const version = await check(origin + "/version.txt?v="+ts,(t)=>t.trim());
  $("version").innerHTML = version.ok
    ? `<span class="ok">OK</span> <code class="mono">${version.data.slice(0,120)}</code>`
    : `<span class="ko">KO</span> (${version.code})`;

  const terr = await check(origin + "/api/territories?v="+ts, (t)=> {
    try { const j = JSON.parse(t); return {ok:j.ok, count: (Array.isArray(j.data)? j.data.length : 0)} } catch { return {ok:false,count:0} }
  });
  $("territories").innerHTML = terr.ok && terr.data.ok
    ? `<span class="ok">OK</span> ${terr.data.count} codes`
    : `<span class="ko">KO</span>`;

  const territory = new URLSearchParams(location.search).get("t") || "guadeloupe";
  const prices = await check(origin + `/api/prices?territory=${encodeURIComponent(territory)}&limit=5&v=${ts}`, (t)=>{
    try { const j = JSON.parse(t); return {ok:j.ok, count: (Array.isArray(j.data)? j.data.length : 0)} } catch { return {ok:false,count:0} }
  });
  $("prices").innerHTML = prices.ok && prices.data.ok
    ? `<span class="ok">OK</span> ${prices.data.count} items (t=<code>${territory}</code>)`
    : `<span class="ko">KO</span>`;
})();
</script>
