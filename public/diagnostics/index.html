<!doctype html>
<html lang="fr">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Diagnostics</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
background:#0f172a;color:#e2e8f0;margin:2rem}
pre{background:#0b1220;border:1px solid #1f2a44;border-radius:12px;padding:1rem;overflow:auto}
a{color:#67e8f9}
.badge{display:inline-block;border:1px solid #244; padding:.2rem .5rem;border-radius:.5rem;background:#0b1220}
.ok{color:#22c55e}.ko{color:#ef4444}
</style>
<h1>🔎 Diagnostics</h1>
<p>Vérifie rapidement la visibilité du déploiement et les endpoints.</p>
<div id="out"><span class="badge">Chargement…</span></div>
<script>
(async () => {
  const base = location.origin;
  const ts = Date.now();
  const out = (html) => document.getElementById('out').innerHTML = html;

  const get = async (p) => {
    try {
      const r = await fetch(p);
      const t = await r.text();
      return { ok: r.ok, status: r.status, text: t };
    } catch (e) { return { ok:false, status:0, text:String(e) }; }
  };

  const v = await get(`/version.txt?v=${ts}`);
  const t = await get(`/api/territories?v=${ts}`);
  const p = await get(`/api/prices?territory=guadeloupe&limit=5&v=${ts}`);

  const ok = (b) => b ? '<b class="ok">OK</b>' : '<b class="ko">KO</b>';
  out(`
  <ul>
    <li>Page HTML… ${ok(true)} (si tu vois cette page, le CDN répond)</li>
    <li>version.txt… ${ok(v.ok)} code=${v.status}</li>
    <li>/api/territories… ${ok(t.ok)} code=${t.status}</li>
    <li>/api/prices (échantillon)… ${ok(p.ok)} code=${p.status}</li>
  </ul>
  <details open><summary>version.txt</summary><pre>${(v.text||'').slice(0,400)}</pre></details>
  <details><summary>territories</summary><pre>${(t.text||'').slice(0,1400)}</pre></details>
  <details><summary>prices</summary><pre>${(p.text||'').slice(0,1400)}</pre></details>
  <p>Base: <a href="${base}">${base}</a></p>
  `);
})();
</script>
