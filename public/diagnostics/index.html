<!doctype html><meta charset="utf-8">
<title>Diagnostics A KI PRI SA YÉ</title>
<style>body{font:16px/1.4 system-ui,Segoe UI,Roboto,Arial;padding:16px;background:#0f172a;color:#e2e8f0}
h1{margin:0 0 12px} button{padding:10px 14px;border-radius:10px;margin:8px 8px 8px 0;border:0;background:#1e293b;color:#e2e8f0;cursor:pointer}
.ok{color:#22c55e}.ko{color:#ef4444}.muted{opacity:.7} video{width:100%;max-width:520px;border-radius:12px;margin-top:12px;background:#020617}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin:12px 0}
.card{padding:12px;border:1px solid #334155;border-radius:12px;background:#0b1220}
small{color:#94a3b8}
</style>
<h1>🔎 Diagnostics</h1>
<div class="grid">
  <div class="card">
    <b>Navigation</b>
    <div id="nav"></div>
    <button onclick="go('/')">Accueil</button>
    <button onclick="go('/enseigne')">Enseignes</button>
    <button onclick="go('/palmares')">Palmarès</button>
    <button onclick="go('/actus')">Actus</button>
    <div><small id="navStatus" class="muted">En attente…</small></div>
  </div>
  <div class="card">
    <b>Caméra / Scanner</b>
    <div id="cam"></div>
    <button id="btnCam">Tester caméra</button>
    <div><small>Si la caméra s’ouvre: ✅ OK. Sinon: vérifier permissions navigateur.</small></div>
    <video id="v" playsinline autoplay muted></video>
  </div>
  <div class="card">
    <b>API</b>
    <div id="api"></div>
    <button onclick="testAPI()">Tester endpoints</button>
    <div><small>Territoires / Prices / version.txt</small></div>
  </div>
</div>
<script>
const d=document, $=s=>d.querySelector(s), log=(id,msg,ok)=>{$(id).innerHTML=`<div class="${ok?'ok':'ko'}">${msg}</div>`}
function go(path){try{history.pushState({},'',path);$('#navStatus').textContent='Route changée vers '+location.pathname;log('#nav','Route '+location.pathname+' ✅',true)}catch(e){log('#nav','Navigation KO '+e,true)}}
$('#btnCam').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#v').srcObject=s;log('#cam','Caméra OK ✅',true)}catch(e){log('#cam','Caméra KO ❌ ('+e.name+')',false)}}
async function testAPI(){
  try{
    const bust=Date.now();
    const a=await fetch(`/api/territories?v=${bust}`); const aj=await a.json(); const ok1=!!aj.ok && Array.isArray(aj.data) && aj.data.length>0;
    const b=await fetch(`/api/prices?territory=guadeloupe&limit=3&v=${bust}`); const bj=await b.json(); const ok2=!!bj.ok && Array.isArray(bj.data);
    const c=await fetch(`/version.txt?v=${bust}`); const t=await c.text(); const ok3=/\d{4}-\d{2}-\d{2}T/.test(t);
    log('#api',`Territories:${ok1?'✅':'❌'} count=${aj.data?.length||0} · Prices:${ok2?'✅':'❌'} items=${bj.data?.length||0} · version.txt:${ok3?'✅':'❌'}`, ok1&&ok2&&ok3);
  }catch(e){log('#api','Erreur API ❌ '+e,false)}
}
</script>
