<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Comparateur de prix • A KI PRI SA YÉ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Comparez les prix des produits entre les différentes enseignes et territoires d'outre-mer.">
  <link rel="stylesheet" href="/css/theme.css"/>
  <style>
    body {
      background: #0b1220;
      color: #e7eefc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 2.5rem;
      margin: 0 0 10px;
      color: #35e1ff;
    }
    .subtitle {
      color: #8da2b5;
      font-size: 1.1rem;
    }
    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .comparison-card {
      background: #0f1629;
      border: 1px solid #1e2945;
      border-radius: 16px;
      padding: 20px;
      transition: all 0.2s ease;
    }
    .comparison-card:hover {
      border-color: #35e1ff;
      transform: translateY(-2px);
    }
    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 15px;
      color: #35e1ff;
    }
    .product-list {
      space-y: 10px;
    }
    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1e2945;
    }
    .product-item:last-child {
      border-bottom: none;
    }
    .product-name {
      font-weight: 500;
    }
    .product-price {
      color: #35e1ff;
      font-weight: 600;
    }
    .store-name {
      font-size: 0.9rem;
      color: #8da2b5;
    }
    .offline-indicator {
      display: none;
      background: #ff6b6b;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
    .offline-indicator.show {
      display: block;
    }
    .sw-status {
      background: #0f1629;
      border: 1px solid #1e2945;
      border-radius: 8px;
      padding: 15px;
      margin-top: 30px;
      font-size: 0.9rem;
    }
    .sw-status-title {
      font-weight: 600;
      margin-bottom: 10px;
      color: #35e1ff;
    }
    .btn {
      background: #35e1ff;
      color: #042029;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin: 5px;
    }
    .btn:hover {
      background: #2dd4f0;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #8da2b5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Comparateur de prix</h1>
      <p class="subtitle">Comparez les prix entre enseignes et territoires</p>
    </div>

    <div id="offlineIndicator" class="offline-indicator">
      📱 Mode hors ligne - Données mises en cache
    </div>

    <div class="comparison-grid" id="comparisonGrid">
      <div class="loading">Chargement des comparaisons de prix...</div>
    </div>

    <!-- Service Worker Status -->
    <div class="sw-status">
      <div class="sw-status-title">🔧 État du Service Worker</div>
      <div id="swStatus">Vérification...</div>
      <button id="updateCache" class="btn">Mettre à jour le cache</button>
      <button id="clearCache" class="btn">Vider le cache</button>
    </div>
  </div>

  <script>
    // Demo comparison data
    const DEMO_COMPARISONS = [
      {
        territory: "martinique",
        flag: "🇲🇶",
        products: [
          { name: "Lait 1L", price: 1.85, store: "Carrefour" },
          { name: "Pain de mie", price: 2.20, store: "Hyper U" },
          { name: "Bananes (kg)", price: 2.45, store: "Market Fresh" }
        ]
      },
      {
        territory: "guadeloupe", 
        flag: "🇬🇵",
        products: [
          { name: "Lait 1L", price: 1.90, store: "Géant Casino" },
          { name: "Pain de mie", price: 2.15, store: "Carrefour" },
          { name: "Bananes (kg)", price: 2.25, store: "Leader Price" }
        ]
      },
      {
        territory: "reunion",
        flag: "🇷🇪", 
        products: [
          { name: "Lait 1L", price: 1.75, store: "Super U" },
          { name: "Pain de mie", price: 2.10, store: "Leclerc" },
          { name: "Bananes (kg)", price: 2.35, store: "Match" }
        ]
      }
    ];

    // DOM elements
    const comparisonGrid = document.getElementById('comparisonGrid');
    const offlineIndicator = document.getElementById('offlineIndicator');
    const swStatus = document.getElementById('swStatus');
    const updateCacheBtn = document.getElementById('updateCache');
    const clearCacheBtn = document.getElementById('clearCache');

    // Load comparison data
    async function loadComparisons() {
      try {
        // Try to fetch real data (will fail in demo)
        const response = await fetch('/api/comparisons');
        if (!response.ok) throw new Error('API not available');
        
        const data = await response.json();
        displayComparisons(data.comparisons || []);
        
      } catch (error) {
        console.log('Using demo data:', error.message);
        // Use demo data
        displayComparisons(DEMO_COMPARISONS);
      }
    }

    function displayComparisons(comparisons) {
      if (comparisons.length === 0) {
        comparisonGrid.innerHTML = '<div class="loading">Aucune comparaison disponible</div>';
        return;
      }

      comparisonGrid.innerHTML = comparisons.map(comparison => `
        <div class="comparison-card">
          <div class="card-title">${comparison.flag} ${comparison.territory.charAt(0).toUpperCase() + comparison.territory.slice(1)}</div>
          <div class="product-list">
            ${comparison.products.map(product => `
              <div class="product-item">
                <div>
                  <div class="product-name">${product.name}</div>
                  <div class="store-name">${product.store}</div>
                </div>
                <div class="product-price">${product.price.toFixed(2)} €</div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // Service Worker management
    async function checkServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        swStatus.innerHTML = '❌ Service Worker non supporté';
        return;
      }

      try {
        const registration = await navigator.serviceWorker.ready;
        swStatus.innerHTML = `✅ Service Worker actif<br>
          📦 Scope: ${registration.scope}<br>
          🔄 État: ${registration.active ? 'Actif' : 'Inactif'}`;
        
        // Get cache status
        if (registration.active) {
          const messageChannel = new MessageChannel();
          messageChannel.port1.onmessage = (event) => {
            const cacheStatus = event.data;
            if (cacheStatus.error) {
              swStatus.innerHTML += '<br>❌ Erreur cache: ' + cacheStatus.error;
            } else {
              const cacheInfo = Object.entries(cacheStatus)
                .map(([name, count]) => `${name}: ${count} éléments`)
                .join('<br>');
              swStatus.innerHTML += '<br>📚 Caches: <br>' + cacheInfo;
            }
          };
          
          registration.active.postMessage(
            { type: 'GET_CACHE_STATUS' },
            [messageChannel.port2]
          );
        }
        
      } catch (error) {
        swStatus.innerHTML = '❌ Erreur: ' + error.message;
      }
    }

    // Update cache
    async function updateCache() {
      if ('serviceWorker' in navigator) {
        try {
          const registration = await navigator.serviceWorker.ready;
          if (registration.active) {
            registration.active.postMessage({ type: 'UPDATE_CACHE' });
            swStatus.innerHTML += '<br>🔄 Mise à jour du cache en cours...';
            setTimeout(checkServiceWorker, 2000);
          }
        } catch (error) {
          console.error('Error updating cache:', error);
        }
      }
    }

    // Clear cache
    async function clearCache() {
      if ('caches' in window) {
        try {
          const cacheNames = await caches.keys();
          await Promise.all(
            cacheNames.map(cacheName => {
              if (cacheName.startsWith('akipsy-')) {
                return caches.delete(cacheName);
              }
            })
          );
          swStatus.innerHTML += '<br>🗑️ Cache vidé';
          setTimeout(checkServiceWorker, 1000);
        } catch (error) {
          console.error('Error clearing cache:', error);
        }
      }
    }

    // Online/offline detection
    function updateOnlineStatus() {
      if (navigator.onLine) {
        offlineIndicator.classList.remove('show');
      } else {
        offlineIndicator.classList.add('show');
      }
    }

    // Event listeners
    updateCacheBtn.addEventListener('click', updateCache);
    clearCacheBtn.addEventListener('click', clearCache);
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // Initialize
    updateOnlineStatus();
    checkServiceWorker();
    loadComparisons();
  </script>

  <div id="site-footer"></div>
  <script src="/js/footer.js" defer></script>

  <!-- Lazy Loading Support -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Add lazy loading to images that don't have it
      const images = document.querySelectorAll('img:not([loading])');
      images.forEach(img => {
        if (img.getBoundingClientRect().top > window.innerHeight * 2) {
          img.setAttribute('loading', 'lazy');
          img.setAttribute('decoding', 'async');
        }
      });
      
      // Add alt attributes to images without them
      const imagesWithoutAlt = document.querySelectorAll('img:not([alt])');
      imagesWithoutAlt.forEach(img => {
        const src = img.getAttribute('src') || '';
        const filename = src.split('/').pop().split('.')[0];
        img.setAttribute('alt', `Image: ${filename}`);
      });
    });
  </script>
</body>
</html>
