<!doctype html><html lang="fr"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Actualités — Vie chère & consommation</title>
<link rel="stylesheet" href="/css/theme.css"/>
</head><body>
<div class="wrapper">
  <nav class="nav"><a href="/index.html">Accueil</a><a href="/avis.html">Avis</a><a href="/enseignes.html">Enseignes</a><a href="/palmares.html">Palmarès</a><a href="/a-propos.html">À propos</a><button id="theme-toggle" class="theme-toggle btn">☀️ Clair</button>  <a href="/tarifs.html">Tarifs</a>
</nav>
  <h1>Actualités — vie chère & consommation</h1>
  <p class="muted">Liens officiels/presse par territoire (éditer <code>/data/news.json</code>).</p>
  <section id="list" class="grid cards" aria-live="polite"></section>
  <p class="muted" id="meta"></p>
</div>
<script src="/js/theme.js" defer></script>
<script>
fetch('/data/news.json').then(r=>r.json()).then(d=>{
  const list=document.getElementById('list');
  list.innerHTML=(d.sections||[]).map(s=>{
    const links=(s.links||[]).map(l=>\`<li><a href="\${l.url}" target="_blank" rel="noopener">\${l.title}</a> — <span class="muted">\${l.source}</span></li>\`).join('');
    return \`<article class="card"><div class="muted">\${s.flag||"🗺️"} \${(s.territory||"").replaceAll("-"," ")}</div><h3 style="margin:.5rem 0">\${s.title||""}</h3><ul>\${links}</ul></article>\`;
  }).join('')||'<div class="muted">Aucune actualité.</div>';
  document.getElementById('meta').textContent='Mise à jour : '+(d.updatedAt||'—');
});
</script>

<div id="site-footer"></div>
  <script src="/js/footer.js" defer></script>
</body></html>
