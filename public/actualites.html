<!doctype html><html lang="fr"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Actualités — Vie chère & consommation</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto; background:#0b1220; color:#e6eefc; margin:0}
  main,header{max-width:1024px;margin:auto;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .card{background:#0f172a;border:1px solid #263143;border-radius:14px;padding:14px}
  .pill{display:inline-block;background:#0b223c;border:1px solid #173055;border-radius:999px;padding:2px 8px;font-size:12px;color:#9cc3ff}
  a{color:#8bd3ff}
  .muted{color:#9fb2cc}
</style>
</head>
<body>
<header>
  <h1>Actualités — Vie chère & consommation</h1>
  <p class="muted">Sélection de liens officiels / presse par territoire (éditer <code>/data/news.json</code>).</p>
</header>
<main>
  <section id="list" class="grid" aria-live="polite"></section>
  <p class="muted" id="meta"></p>
</main>
<script>
fetch('/data/news.json').then(r=>r.json()).then(d=>{
  const list=document.getElementById('list');
  list.innerHTML=(d.sections||[]).map(s=>{
    const links=(s.links||[]).map(l=>`<li><a href="${l.url}" target="_blank" rel="noopener">${l.title}</a> — <span class="muted">${l.source}</span></li>`).join('');
    return `<article class="card">
      <div class="pill">${s.flag||"🗺️"} ${(s.territory||"").replaceAll("-"," ")}</div>
      <h3 style="margin:.5rem 0">${s.title||""}</h3>
      <ul>${links}</ul>
    </article>`;
  }).join('') || '<div class="muted">Aucune actualité.</div>';
  document.getElementById('meta').textContent = 'Mise à jour : ' + (d.updatedAt||'—');
});
</script>
</body></html>
