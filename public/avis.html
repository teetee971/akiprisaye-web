<!doctype html><html lang="fr">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Avis — A KI PRI SA YÉ</title>
<link rel="stylesheet" href="/styles.css"/>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto; color:#e8eef9; background:#0b1220}
  .wrap{max-width:960px;margin:40px auto;padding:0 16px}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .card{background:#0f172a;border:1px solid #263143;border-radius:14px;padding:14px}
  .muted{color:#9fb2cc}
  .stars{letter-spacing:2px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Vos avis</h1>
      <input id="q" placeholder="Filtrer par territoire, ville, texte…" style="padding:8px 10px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#e8eef9;width:260px">
    </div>
    <section id="list" class="grid" aria-live="polite"></section>
  </div>

<script>
const el = s => document.querySelector(s);
const list = el('#list');
const star = n => '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(n,5).replace(/./g,'');
let ALL = [];

const tpl = r => `
  <article class="card">
    <div style="display:flex;gap:8px;align-items:center">
      <div style="font-size:22px">${r.flag||''}</div>
      <div>
        <div style="font-weight:700">${r.name}</div>
        <div class="muted">${(r.city||'').trim()} — ${(r.territory||'').replace('-',' ')}</div>
      </div>
      <div style="margin-left:auto" class="stars" aria-label="${r.rating} étoiles">${'★'.repeat(r.rating)}</div>
    </div>
    <p style="margin:10px 0 4px">${r.text}</p>
    <div class="muted" style="font-size:12px">${r.date||''}</div>
  </article>`;

function render(){
  const q = (el('#q').value||'').toLowerCase();
  const out = ALL.filter(r => {
    const hay = [r.flag,r.territory,r.city,r.text,r.name].join(' ').toLowerCase();
    return !q || hay.includes(q);
  });
  list.innerHTML = out.map(tpl).join('') || `<div class="muted">Aucun avis pour ce filtre.</div>`;
}
fetch('/data/reviews.json').then(r=>r.json()).then(j=>{ ALL=j.items||[]; render(); });
el('#q').addEventListener('input',render);
</script>
</body></html>
