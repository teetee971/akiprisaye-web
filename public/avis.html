<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Avis • A KI PRI SA YÉ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{background:#0b1220;color:#e7eefc;font-family:system-ui,Segoe UI,Roboto,Inter,Arial}
    .wrap{max-width:980px;margin:32px auto;padding:0 16px}
    .h1{font-size:2rem;font-weight:800;margin:8px 0 16px}
    .muted{opacity:.7}
    .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .card{background:#0f1629;border:1px solid #1e2945;border-radius:16px;padding:14px}
    .tag{font-size:.75rem;opacity:.8;background:#17213a;padding:4px 8px;border-radius:999px;margin-right:6px}
    .stars{letter-spacing:2px}
    .form{margin:24px 0;background:#0f1629;border:1px dashed #2a3a6b;border-radius:16px;padding:14px}
    input,select,textarea{width:100%;background:#0b1220;border:1px solid #2a3a6b;border-radius:12px;color:#e7eefc;padding:10px}
    button{background:#16c784;border:0;color:#00140a;padding:10px 14px;border-radius:12px;font-weight:700}
    .row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
    @media(max-width:640px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="h1">Avis des utilisateurs</div>
    <p class="muted">Retours réels (+ démo) avec drapeau du territoire. Les avis récents apparaissent en premier.</p>

    <div class="row" style="margin:16px 0">
      <select id="fltTerr"><option value="">— Tous territoires —</option></select>
      <input id="fltQ" placeholder="Rechercher (ville, enseigne, texte…)" />
    </div>

    <section id="list" class="grid" aria-live="polite"></section>

    <form id="f" class="form" onsubmit="return false">
      <h3 style="margin:0 0 8px">Ajouter un avis local</h3>
      <div class="row">
        <select id="territory" required>
          <option value="">— Territoire —</option>
        </select>
        <input id="city" placeholder="Ville" required />
      </div>
      <div class="row">
        <input id="store" placeholder="Enseigne / magasin" required />
        <select id="rating" required>
          <option value="">Note</option>
          <option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
        </select>
      </div>
      <textarea id="text" rows="4" placeholder="Votre avis (1000 car. max)" maxlength="1000" required></textarea>
      <div class="row">
        <input id="author" placeholder="Votre prénom (optionnel)" />
        <button id="btnAdd">Publier (local)</button>
      </div>
      <p class="muted" style="margin:6px 0 0">Le formulaire enregistre localement (localStorage) pour démo. Intégration serveur possible ensuite.</p>
    </form>
  </div>

  <script type="module">
    import { TERR_FLAGS } from "/js/flags.js";

    const $ = (id)=>document.getElementById(id);
    const list = $("list");
    let ALL = [];

    const TERRS = [
      "guadeloupe","martinique","guyane","reunion","mayotte",
      "saint-martin","saint-barthelemy","polynesie-francaise",
      "nouvelle-caledonie","wallis-et-futuna"
    ];
    const addOptions=(sel)=>{ sel.innerHTML = '<option value=\"\">— Tous territoires —</option>'+TERRS.map(t=>`<option value="${t}">${TERR_FLAGS[t]||"🏳️"} ${t.replace('-',' ')}</option>`).join(''); };

    addOptions($("fltTerr")); addOptions($("territory"));

    const star = n => "★★★★★☆☆☆☆☆".slice(5-n,10-n);
    const card = r => `
      <article class="card">
        <div style="display:flex;gap:8px;align-items:center">
          <span class="tag">${TERR_FLAGS[r.territory]||"🏳️"} ${r.territory}</span>
          <span class="tag">${r.city}</span>
          <span class="tag">${r.store}</span>
        </div>
        <h3 style="margin:8px 0">${r.author||"Anonyme"}</h3>
        <div class="stars" aria-label="Note ${r.rating}/5">⭐ ${star(r.rating)}</div>
        <p style="margin:8px 0 0">${r.text}</p>
        <div class="muted" style="margin-top:8px">${new Date(r.date).toLocaleDateString()}</div>
      </article>
    `;

    const RKEY="akiprisaye_reviews_local";
    const loadLocal=()=>{ try{
      const cur = JSON.parse(localStorage.getItem(RKEY)||"[]");
      if(Array.isArray(cur) && cur.length) ALL = [...cur, ...ALL];
    }catch(e){} };

    const saveLocal=(r)=>{ try{
      const cur = JSON.parse(localStorage.getItem(RKEY)||"[]");
      cur.unshift(r); localStorage.setItem(RKEY, JSON.stringify(cur));
    }catch(e){} };

    const render=()=>{
      const t= $("fltTerr").value.trim().toLowerCase();
      const q= $("fltQ").value.trim().toLowerCase();
      const out = ALL
        .filter(x => (!t || x.territory===t))
        .filter(x => !q || (`${x.city} ${x.store} ${x.text}`.toLowerCase().includes(q)))
        .sort((a,b)=> (b.date>a.date?1:-1));
      list.innerHTML = out.map(card).join('') || '<div class="muted">Aucun avis pour ce filtre.</div>';
    };

    $("fltTerr").onchange = $("fltQ").oninput = render;

    $("btnAdd").onclick=()=>{
      const r = {
        id: "RV-"+Math.random().toString(36).slice(2,8).toUpperCase(),
        territory: $("territory").value.trim(),
        city: $("city").value.trim(),
        store: $("store").value.trim(),
        rating: +$("rating").value,
        author: $("author").value.trim(),
        text: $("text").value.trim(),
        date: new Date().toISOString().slice(0,10)
      };
      if(!r.territory || !r.city || !r.store || !r.rating || !r.text){ alert("Complète le formulaire."); return; }
      saveLocal(r);
      ALL = [r, ...ALL];
      ["text","city","store","author"].forEach(id=>$(id).value=""); $("rating").value=""; $("territory").value="";
      render();
    };

    fetch('/data/reviews.json').then(r=>r.json()).then(json=>{
      ALL = json.reviews||[];
      loadLocal(); render();
    });
  </script>

  <!-- Lazy Loading Support -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Add lazy loading to images that don't have it
      const images = document.querySelectorAll('img:not([loading])');
      images.forEach(img => {
        if (img.getBoundingClientRect().top > window.innerHeight * 2) {
          img.setAttribute('loading', 'lazy');
          img.setAttribute('decoding', 'async');
        }
      });
      
      // Add alt attributes to images without them
      const imagesWithoutAlt = document.querySelectorAll('img:not([alt])');
      imagesWithoutAlt.forEach(img => {
        const src = img.getAttribute('src') || '';
        const filename = src.split('/').pop().split('.')[0];
        img.setAttribute('alt', `Image: ${filename}`);
      });
    });
  </script>
  <script>
    // Enhanced lazy loading with intersection observer and WebP support
    document.addEventListener('DOMContentLoaded', function() {
      // Native lazy loading support check
      if ('loading' in HTMLImageElement.prototype) {
        console.log('Native lazy loading supported');
      } else {
        // Load polyfill for browsers that don't support lazy loading
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/vanilla-lazyload@17.8.4/dist/lazyload.min.js';
        script.onload = () => {
          new LazyLoad({
            elements_selector: 'img[loading="lazy"]',
            use_native: false
          });
        };
        document.head.appendChild(script);
      }
      
      // WebP support detection
      function supportsWebP() {
        const canvas = document.createElement('canvas');
        canvas.width = 1;
        canvas.height = 1;
        return canvas.toDataURL('image/webp').indexOf('data:image/webp') === 0;
      }
      
      // Apply WebP fallback if needed
      if (!supportsWebP()) {
        const pictures = document.querySelectorAll('picture');
        pictures.forEach(picture => {
          const img = picture.querySelector('img');
          const webpSource = picture.querySelector('source[type="image/webp"]');
          if (webpSource && img) {
            webpSource.remove();
          }
        });
      }
    });
  </script></body>
</html>
