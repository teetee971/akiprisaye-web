<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Avis – A KI PRI SA YÉ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',sans-serif;background:#0b1020;color:#e7ebf3;margin:0}
    header,main{max-width:1024px;margin:auto;padding:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .card{background:#0f152b;border:1px solid #1e2647;border-radius:16px;padding:16px;box-shadow:0 10px 24px rgba(0,0,0,.2)}
    .muted{opacity:.8;font-size:.9rem}
    .star{color:#16e;filter:brightness(1.2)}
    .pill{display:inline-flex;gap:8px;align-items:center;background:#102046;border:1px solid #22346e;border-radius:999px;padding:6px 10px;margin:6px 6px 0 0}
    .flag{font-size:20px}
    .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
    input,select{background:#0f152b;border:1px solid #233065;color:#e7ebf3;border-radius:10px;padding:10px 12px}
    a.btn{background:#1fb673;color:white;text-decoration:none;padding:10px 14px;border-radius:12px}
  </style>
</head>
<body>
<header class="row">
  <h1 style="margin:0">Avis</h1>
  <nav style="display:flex;gap:8px">
    <a class="btn" href="/index.html">Accueil</a>
    <a class="btn" href="/enseignes.html">Enseignes</a>
    <a class="btn" href="/palmares.html">Palmarès</a>
    <a class="btn" href="/actus.html">Actus</a>
    <a class="btn" href="/a-propos.html">À propos</a>
  </nav>
</header>
<main>
  <div class="toolbar">
    <select id="t"><option value="">Tous territoires</option></select>
    <input id="q" placeholder="Recherche (nom, ville, avis)…">
  </div>
  <section id="list" class="grid" aria-live="polite"></section>
</main>
<script>
const $ = (id)=>document.getElementById(id);
const list = $("list");
let TERR=[], REV=[];

const rating = n => "★".repeat(n) + "☆".repeat(5-n);

const flagOf = code => (TERR.find(t=>t.code===code)||{}).flag || "🇫🇷";
const nameOf = code => (TERR.find(t=>t.code===code)||{}).name || code;

const card = r => `
  <article class="card">
    <div class="row">
      <div class="pill"><span class="flag">${flagOf(r.territory)}</span><b>${nameOf(r.territory)}</b></div>
      <div class="muted">${r.city||""}</div>
    </div>
    <h3 style="margin:.6rem 0">${r.name}</h3>
    <div class="star" aria-label="${r.rating} sur 5">${rating(r.rating)}</div>
    <p class="muted">${r.text}</p>
    <div class="muted">${new Date(r.date).toLocaleDateString()}</div>
  </article>
`;

function render(){
  const t = $("t").value;
  const q = $("q").value.toLowerCase().trim();
  const out = REV.filter(x=>{
    const okT = !t || x.territory===t;
    const inTxt = (x.name+" "+(x.city||"")+" "+x.text).toLowerCase().includes(q);
    return okT && inTxt;
  });
  list.innerHTML = out.map(card).join("") || '<div class="muted">Aucun avis</div>';
}

Promise.all([
  fetch("/data/territories.json").then(r=>r.json()),
  fetch("/data/reviews.json").then(r=>r.json())
]).then(([terr,rev])=>{
  TERR=terr; REV=rev.sort((a,b)=>b.date.localeCompare(a.date));
  // options territoire
  $("t").innerHTML = '<option value="">Tous territoires</option>'+ TERR.map(t=>`<option value="${t.code}">${t.flag} ${t.name}</option>`).join('');
  ["t","q"].forEach(id=>$(id).addEventListener("input",render));
  render();
});
</script>
</body>
</html>
