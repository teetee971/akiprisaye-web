  <section id="list" class="grid cards" aria-live="polite"></section>

  <div class="card" style="margin-top:16px">

        <option value="guyane">🇬🇫 Guyane</option><option value="reunion">🇷🇪 Réunion</option><option value="mayotte">🇾🇹 Mayotte</option>
        <option value="saint-martin">🇲🇫 Saint-Martin</option><option value="saint-barthelemy">🇧🇱 Saint-Barthélemy</option>
        <option value="polynesie-francaise">🇵🇫 Polynésie française</option><option value="nouvelle-caledonie">🇳🇨 Nouvelle-Calédonie</option><option value="wallis-et-futuna">🇼🇫 Wallis-et-Futuna</option>
      </select>
      <input id="city" class="input" placeholder="Ville"/>
      <select id="rating" class="input"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
    </div>
    <textarea id="text" class="input" rows="4" placeholder="Votre avis (prix, disponibilité, accueil…)"></textarea>
    <div style="margin-top:10px"><button id="send" class="btn">Envoyer</button> <span class="muted">Démo: avis stockés localement.</span></div>
  </div>
</div>
<script src="/js/theme.js" defer></script>
<script>
const list=document.getElementById('list'); const $=id=>document.getElementById(id);
const FLAGS={"guadeloupe":"🇬🇵","martinique":"🇲🇶","guyane":"🇬🇫","reunion":"🇷🇪","mayotte":"🇾🇹","saint-martin":"🇲🇫","saint-barthelemy":"🇧🇱","polynesie-francaise":"🇵🇫","nouvelle-caledonie":"🇳🇨","wallis-et-futuna":"🇼🇫"};
const RKEY="akp-reviews-local"; let ALL=[];

function render(){const t=.value;const q=(.value||'').toLowerCase().trim();const out=ALL.filter(r=>(!t||r.territory===t)&&[` ${r.text} ${r.city} ${r.name}`].join(' ').toLowerCase().includes(q)); list.innerHTML=out.length?out.map(card).join(''):'<div class="muted">Aucun avis.</div>';}
