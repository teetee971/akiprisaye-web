name = "akiprisaye-price-api"
main = "src/index.ts"
compatibility_date = "2025-02-01"

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://akiprisaye-web.pages.dev"
AGG_WINDOW_DAYS = "60"
CACHE_TTL_SECONDS = "21600" # 6h
POST_RATE_LIMIT_PER_MIN = "30"

[[d1_databases]]
binding = "PRICE_DB"
database_name = "akiprisaye_price_db"
database_id = "REPLACE_WITH_D1_ID"
