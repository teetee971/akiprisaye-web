<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A KI PRI SA YÉ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>A KI PRI SA YÉ</h1>
  <p>Comparez les prix, suivez votre budget et trouvez l’enseigne la moins chère.</p>
  <button onclick="window.location.href='#'">Télécharger maintenant</button>

  <h2>Palmarès – Meilleures enseignes</h2>
  <label for="zone">Zone :</label>
  <select id="zone">
    <option value="martinique">Martinique</option>
    <option value="guadeloupe">Guadeloupe</option>
    <option value="guyane">Guyane</option>
    <option value="reunion">Réunion</option>
    <option value="mayotte">Mayotte</option>
    <option value="saint-pierre-et-miquelon">Saint-Pierre-et-Miquelon</option>
    <option value="saint-barthelemy">Saint-Barthélemy</option>
    <option value="saint-martin">Saint-Martin</option>
    <option value="polynesie-francaise">Polynésie Française</option>
    <option value="wallis-et-futuna">Wallis-et-Futuna</option>
  </select>
  <button onclick="loadRanking()">Actualiser</button>

  <table border="1">
    <thead>
      <tr>
        <th>Rang</th>
        <th>Enseigne</th>
        <th>Panier moyen</th>
        <th>Échantillon</th>
      </tr>
    </thead>
    <tbody id="ranking-body">
      <tr>
        <td colspan="4">Choisissez une zone pour voir le classement</td>
      </tr>
    </tbody>
  </table>

  <script>
    const ENDPOINT = "https://us-central1-a-ki-pri-sa-ye.cloudfunctions.net/getRanking";

    async function loadRanking() {
      const zone = document.getElementById("zone").value;
      const res = await fetch(`${ENDPOINT}?zone=${zone}`);
      const data = await res.json();

      const tbody = document.getElementById("ranking-body");
      tbody.innerHTML = "";

      if (!data.rows || data.rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4">Pas encore de données pour ${zone}</td></tr>`;
        return;
      }

      data.rows.forEach((row, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td>${row.store}</td>
            <td>${row.avgPrice.toFixed(2)} €</td>
            <td>${row.count}</td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
