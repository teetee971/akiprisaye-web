<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A KI PRI SA YÉ</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #121212;
      color: #f1f1f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    textarea, input {
      width: 90%;
      max-width: 600px;
      background: #1e1e1e;
      color: white;
      border: 1px solid #555;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
    }
    button {
      padding: 10px 20px;
      background: #00c853;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #00e676;
    }
  </style>
</head>
<body>
  <h1>A KI PRI SA YÉ</h1>
  <textarea id="output" rows="10" readonly placeholder="Réponse IA ici..."></textarea>
  <input id="userInput" placeholder="Pose ta question..." />
  <button onclick="sendPrompt()">Envoyer</button>
  <button onclick="startVoice()">🎤 Parler</button>

  <script>
    async function sendPrompt(text = null) {
      const input = text || document.getElementById("userInput").value;
      const response = await fetch("http://localhost:11434/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "llama3",
          messages: [{ role: "user", content: input }]
        })
      });
      const data = await response.json();
      const output = data.message.content;
      document.getElementById("output").value = output;
      speak(output);
    }

    function speak(text) {
      const synth = window.speechSynthesis;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "fr-FR";
      synth.speak(utter);
    }

    function startVoice() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = "fr-FR";
      recognition.start();
      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById("userInput").value = transcript;
        sendPrompt(transcript);
      };
    }
  </script>
</body>
</html>
