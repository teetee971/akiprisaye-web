name = "sentinel-vnp-api"
main = "api/vnp_worker.js"
compatibility_date = "2024-06-01"

[[d1_databases]]
binding = "DB"
database_name = "sentinel_vnp"
database_id = "DB_ID_PLACEHOLDER"

[[kv_namespaces]]
binding = "RL"
id = "KV_ID_PLACEHOLDER"

[vars]
MAIL_TO   = "thierrynaud2009@gmail.com"
MAIL_FROM = "no-reply@sentinel-fusion.pages.dev"
CORS_ORIGIN = "https://sentinel-fusion.pages.dev"
# X_VNP_KEY = "TaCleUltraSecrete"      # (optionnel) clé requise sur les requêtes AJAX (header x-vnp-key)
# PROVISION_WEBHOOK = "https://vps:8787/hook/vnp"  # (optionnel) callback serveur
# PROVISION_KEY     = "TaCleUltraSecrete"          # (optionnel) clé transmise au serveur (header x-hook-key)
# WG_ENDPOINT       = "vpn.example.com:51820"
# WG_SERVER_PUBKEY  = "<SERVER_PUBKEY>"
# WG_ALLOWED_IPS    = "0.0.0.0/0, ::/0"
# WG_DNS            = "1.1.1.1"
