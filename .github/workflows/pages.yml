name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/configure-pages@v5

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
          BASE_PATH: '/akiprisaye-web/'
        run: npm run build


      - name: Validate GitHub Pages asset base paths
        working-directory: frontend
        run: |
          if grep -nE 'src="/assets/|href="/assets/|href="/manifest\.webmanifest|href="/logo-akiprisaye\.svg|src="/logo-akiprisaye\.svg|href="/favicon|href="/apple-touch-icon|href="/mask-icon' dist/index.html; then
            echo '❌ Found bare root paths in dist/index.html (forbidden: /assets, /manifest.webmanifest, /logo-akiprisaye.svg, /favicon*, /apple-touch-icon*, /mask-icon*)'
            exit 1
          fi
          echo '✅ Asset paths are correctly prefixed for GitHub Pages.'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
