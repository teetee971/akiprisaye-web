name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main        # déclenchement sur main
      - copilot/create-citizen-support-service  # déclenchement sur la branche de développement
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prévention Git LFS (empêche l'ajout accidentel de pointeurs LFS)
      - name: Disable Git LFS
        run: git config --global filter.lfs.required false

      # Garde préventive : vérifier l'absence de pointeurs LFS
      - name: Check for LFS pointers
        run: |
          if git grep -I -n -E '^version https://git-lfs.github.com/spec/v1$' -- . | grep -vE '^(\.github/workflows/|\.circleci/|scripts/|.*\.md:)' >/dev/null; then
            echo "❌ ERREUR: Pointeurs Git LFS détectés dans le dépôt"
            exit 1
          else
            echo "✅ OK: Aucun pointeur Git LFS détecté"
          fi

          if git grep -I -n -E '^oid sha256:[0-9a-f]{64}$' -- . | grep -vE '^(\.github/workflows/|\.circleci/|scripts/|.*\.md:)' >/dev/null; then
            echo "❌ ERREUR: Pointeur LFS probable (oid)"
            exit 1
          else
            echo "✅ OK: Aucun oid LFS détecté"
          fi

      # Installation de Node.js et mise en cache des dépendances npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      # Installation des dépendances du projet
      - name: Install dependencies
        run: npm ci

      # Build de l'application Vite/React (génère le dossier dist)
      - name: Build application
        run: npm run build

      # Déploiement du contenu du dossier dist vers Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: akiprisaye-web
          directory: frontend/dist             # important : dossier de build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify /api/health returns JSON (no HTML fallback)
        run: |
          set -euo pipefail

          url="https://akiprisaye-web.pages.dev/api/health"
          ok=0

          for attempt in {1..8}; do
            headers_file="$(mktemp)"
            body_file="$(mktemp)"

            status="$(curl -sS -D "$headers_file" -o "$body_file" -w "%{http_code}" "$url")"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print tolower($0)}' "$headers_file" | tr -d '\r')"

            if [ "$status" = "200" ] \
              && echo "$content_type" | grep -q "application/json" \
              && head -c 1 "$body_file" | grep -q '{'; then
              echo "✅ /api/health OK (status=200, content-type JSON)"
              ok=1
              break
            fi

            echo "⚠️ Attempt ${attempt}/8 failed: status=$status, content-type=${content_type:-<missing>}"
            echo "Body preview: $(head -c 160 "$body_file")"
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "❌ /api/health is not returning JSON from Pages Functions"
            exit 1
          fi

      # Purge du cache inutile (pas de domaine personnalisé)
      - name: Skip cache purge
        if: success()
        run: |
          echo "Purge skipped: Cloudflare Pages without custom domain does not support API cache purge."
