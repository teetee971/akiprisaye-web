name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  DEPLOYMENT_URL: 'https://akiprisaye-web.pages.dev'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prévention Git LFS (empêche l'ajout accidentel de pointeurs LFS)
      - name: Disable Git LFS
        run: git config --global filter.lfs.required false

      # Garde préventive : vérifier l'absence de pointeurs LFS
      - name: Check for LFS pointers
        run: |
          if git grep -I -n -E '^version https://git-lfs.github.com/spec/v1$' -- . | grep -vE '^(\.github/workflows/|\.circleci/|scripts/|.*\.md:)' >/dev/null; then
            echo "❌ ERREUR: Pointeurs Git LFS détectés dans le dépôt"
            exit 1
          else
            echo "✅ OK: Aucun pointeur Git LFS détecté"
          fi

          if git grep -I -n -E '^oid sha256:[0-9a-f]{64}$' -- . | grep -vE '^(\.github/workflows/|\.circleci/|scripts/|.*\.md:)' >/dev/null; then
            echo "❌ ERREUR: Pointeur LFS probable (oid)"
            exit 1
          else
            echo "✅ OK: Aucun oid LFS détecté"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        working-directory: frontend
        run: npm run build

      - name: Build Pages Functions worker
        run: |
          set -euo pipefail
          test -f frontend/functions/api/health.ts
          npx wrangler@3 pages functions build frontend/functions --outdir frontend/dist
          test -s frontend/dist/_worker.js

      - name: 🧾 Inspect worker bundle for API markers
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('frontend/dist/_worker.js','utf8');if(!(s.includes('/api')||s.includes('api/'))){console.error('No /api markers found in _worker.js');process.exit(1)}"

      - name: Deploy to Cloudflare Pages (Wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages deploy frontend/dist --project-name akiprisaye-web --branch main

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Deployed to: ${{ env.DEPLOYMENT_URL }}"
