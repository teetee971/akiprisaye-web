name: 🚀 Déployer sur Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installer dépendances
        run: |
          # Essayer npm ci d'abord, puis fallback vers npm install
          if [ -f package-lock.json ]; then
            echo "📋 Utilisation de npm ci avec package-lock.json existant"
            npm ci || {
              echo "⚠️ npm ci a échoué, fallback vers npm install"
              npm install
            }
          else
            echo "📋 Aucun package-lock.json trouvé, utilisation de npm install"
            npm install
          fi

      - name: 🏗️ Build
        run: npm run build

      - name: 🚀 Déploiement Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PROJECT_NAME }}
          directory: dist

      - name: 🧹 Purge cache Cloudflare
        if: ${{ secrets.CF_ZONE_ID != '' }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: 📝 Résumé de déploiement complet
        run: |
          echo "# 🚀 Déploiement A KI PRI SA YÉ" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Informations de déploiement" >> $GITHUB_STEP_SUMMARY
          echo "- **🌐 URL de production:** [https://akiprisaye.pages.dev](https://akiprisaye.pages.dev)" >> $GITHUB_STEP_SUMMARY
          echo "- **🌿 Branche:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **📝 Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **📅 Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **👤 Auteur:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔄 Actions effectuées" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Installation des dépendances npm" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build de l'application Vite + React" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Déploiement sur Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Purge du cache Cloudflare" >> $GITHUB_STEP_SUMMARY
