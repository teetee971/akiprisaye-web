name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main        # déclenchement sur main
      - copilot/create-citizen-support-service  # déclenchement sur la branche de développement
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prévention Git LFS (empêche l'ajout accidentel de pointeurs LFS)
      - name: Disable Git LFS
        run: git config --global filter.lfs.required false

      # Garde préventive : vérifier l'absence de pointeurs LFS
      - name: Check for LFS pointers
        run: |
          if git grep -I -n -E '^version https://git-lfs.github.com/spec/v1$' -- . | grep -vE '^(\.github/workflows/|\.circleci/|scripts/|.*\.md:)' >/dev/null; then
            echo "❌ ERREUR: Pointeurs Git LFS détectés dans le dépôt"
            exit 1
          else
            echo "✅ OK: Aucun pointeur Git LFS détecté"
          fi

          if git grep -I -n -E '^oid sha256:[0-9a-f]{64}$' -- . | grep -vE '^(\.github/workflows/|\.circleci/|scripts/|.*\.md:)' >/dev/null; then
            echo "❌ ERREUR: Pointeur LFS probable (oid)"
            exit 1
          else
            echo "✅ OK: Aucun oid LFS détecté"
          fi

      # Installation de Node.js et mise en cache des dépendances npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      # Installation des dépendances du projet
      - name: Install dependencies
        run: npm ci

      # Build de l'application Vite/React (génère le dossier dist)
      - name: Build application
        run: npm run build

      # Pages Functions are bundled as _worker.js before Pages deploy.
      - name: Build Pages Functions worker bundle
        run: |
          npx wrangler@3 pages functions build functions --outfile frontend/dist/_worker.js

      - name: Verify worker bundle
        run: |
          test -s frontend/dist/_worker.js

      - name: Resolve Pages branch
        id: pages-branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # Déploiement du contenu du dossier dist + _worker.js vers Cloudflare Pages
      - name: Deploy to Cloudflare Pages with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages deploy frontend/dist --project-name akiprisaye-web --branch "${{ steps.pages-branch.outputs.branch }}"

      - name: Smoke test API health on production
        if: github.ref == 'refs/heads/main'
        run: |
          body=$(curl -fsS https://akiprisaye-web.pages.dev/api/health)
          echo "$body"
          echo "$body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true|"status"[[:space:]]*:[[:space:]]*"ok"'

      # Purge du cache inutile (pas de domaine personnalisé)
      - name: Skip cache purge
        if: success()
        run: |
          echo "Purge skipped: Cloudflare Pages without custom domain does not support API cache purge."
