name: Validate groupes JSON

on:
  push:
    paths:
      - 'data/groupes/**'
  pull_request:
    paths:
      - 'data/groupes/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install ajv-cli
        run: npm install -g ajv-cli
      - name: Validate JSON files
        run: |
          find data/groupes -name '*.json' ! -name 'schema.json' -exec ajv validate -s data/groupes/schema.json -d {} \;
