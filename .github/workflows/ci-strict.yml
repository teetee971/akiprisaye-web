name: CI Strict (Production UX Audit)

on:
  pull_request:
    branches: ["main", "production"]
  push:
    branches: ["main", "production"]

permissions:
  contents: read

jobs:
  ci-strict:
    name: CI + Production UX Audit
    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_BASE_URL: https://akiprisaye-web.pages.dev
      PLAYWRIGHT_USE_LOCAL_SERVER: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript strict check
        working-directory: frontend
        run: npm run typecheck:ci
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: ESLint strict check (max-warnings=0)
        working-directory: frontend
        run: npm run lint:ci
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Build (Vite)
        working-directory: frontend
        run: npm run build:ci
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Install Playwright browsers (official action)
        uses: microsoft/playwright-github-action@v1
        with:
          working-directory: frontend

      - name: Production UX audit (PR report-only)
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          UX_AUDIT_STRICT: '0'
        run: npm run e2e
        continue-on-error: true

      - name: Production UX audit (push strict)
        if: github.event_name == 'push'
        working-directory: frontend
        env:
          UX_AUDIT_STRICT: '1'
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: frontend/test-results
          retention-days: 30

      - name: Upload UX axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-axe-report
          path: frontend/ux-axe-report.txt
          retention-days: 30
