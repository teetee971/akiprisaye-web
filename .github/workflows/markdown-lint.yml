name: Markdown Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run markdownlint
        run: npx markdownlint "**/*.md" --ignore node_modules
