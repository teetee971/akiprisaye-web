name: Create D1 Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-d1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: price-api

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: price-api/package-lock.json

      - run: npm ci

      - name: Vérifier le token Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # account_id est défini dans wrangler.toml — CLOUDFLARE_ACCOUNT_ID secret est optionnel.
          # CLOUDFLARE_API_TOKEN reste obligatoire pour s'authentifier auprès de l'API.
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "❌ Le secret CLOUDFLARE_API_TOKEN est absent ou vide."
            echo ""
            echo "   ── Étapes pour créer le jeton ──────────────────────────────"
            echo "   1. Ouvrez : https://dash.cloudflare.com/profile/api-tokens"
            echo "   2. Cliquez sur 'Créer un jeton' → 'Créer un jeton personnalisé'"
            echo "   3. Nom : akiprisaye-web-ci"
            echo "   4. Autorisations (3 lignes) :"
            echo "        Compte | Workers D1         | Modifier"
            echo "        Compte | Scripts Workers    | Modifier"
            echo "        Compte | Cloudflare Pages   | Modifier"
            echo "   5. Ressources du compte : Inclure → Tous les comptes"
            echo "   6. Cliquez 'Créer le jeton' et copiez la valeur affichée."
            echo "   7. Dans GitHub : Settings › Secrets and variables › Actions"
            echo "      → 'New repository secret' → Nom : CLOUDFLARE_API_TOKEN"
            echo "   ────────────────────────────────────────────────────────────"
            echo "   📄 Guide complet : CLOUDFLARE_SETUP.md à la racine du dépôt"
            exit 1
          fi
          echo "✅ CLOUDFLARE_API_TOKEN présent"
          echo "ℹ️  account_id lu depuis price-api/wrangler.toml (78642e56f72fff94c78e1ef87cb589a7)"

      - name: Create D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 create price-db
