# CI Pipeline V2 — akiprisaye-web / frontend
#
# Jobs séparés pour une meilleure lisibilité et un échec précis :
#   build      → Build production Vite (PR uniquement)
#   lint       → ESLint (PR uniquement)
#   typecheck  → TypeScript strict (PR uniquement)
#   lighthouse → Audit Lighthouse CI (PR + push main)
#   ci-summary → Résumé agrégé de tous les jobs
#
# Stratégie :
#   - build/lint/typecheck ne s'exécutent que sur pull_request
#   - lighthouse s'exécute toujours (PR et push main)
#   - Node 22, arrêt propre du serveur preview, upload des rapports non bloquant
#   - working-directory: frontend sur les jobs frontend pour éviter toute ambiguïté

name: CI

on:
  # workflow_dispatch intentionally removed in V2 — ad-hoc audits on preview URLs were
  # handled by the old lighthouse-guard.mjs --url flow which is no longer present.
  # Re-add if a dedicated on-demand audit step is introduced.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - 'frontend/lighthouserc.cjs'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - 'frontend/lighthouserc.cjs'

permissions:
  contents: read        # actions/checkout
  pull-requests: read   # least privilege; escalate to write per-job only when a step writes to PRs
  # actions: read intentionally absent — V2 no longer downloads baseline artifacts via API.
  # The old lighthouse-guard.mjs --compare flow (which needed actions:read) has been
  # removed. If artifact download is re-introduced, add actions: read here.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── 1. Build ───────────────────────────────────────────────────
  build:
    name: Build (pull_request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ─── 2. Lint ────────────────────────────────────────────────────
  lint:
    name: Lint (pull_request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ─── 3. Typecheck ───────────────────────────────────────────────
  typecheck:
    name: Typecheck (pull_request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ─── 4. Lighthouse CI ──────────────────────────────────────────────
  # Mesure performance + accessibilité + best-practices + SEO sur le build de preview.
  # Config : frontend/lighthouserc.cjs (V2).
  # URL cible : http://127.0.0.1:4173 (npm run preview).
  # Sorties : rapports JSON + HTML uploadés en artefacts CI (non bloquant si absent).
  lighthouse:
    name: Lighthouse CI (${{ github.event_name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lh-preview.log 2>&1 &
          echo $! > /tmp/lh-preview.pid

      - name: Wait for preview server
        run: npx wait-on@8.0.1 http://127.0.0.1:4173

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: |
            frontend/.lighthouseci/**
            frontend/lighthouse-results/**
          if-no-files-found: warn

      - name: Upload Lighthouse scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-scores-${{ github.run_id }}
          path: |
            frontend/lighthouse-results/**/*.json
            frontend/.lighthouseci/**/*.json
          if-no-files-found: warn

      - name: Print preview server log on failure
        if: failure()
        run: |
          echo "===== /tmp/lh-preview.log ====="
          cat /tmp/lh-preview.log || true

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/lh-preview.pid ]; then
            kill "$(cat /tmp/lh-preview.pid)" || true
          fi

  # ─── 5. CI Summary ───────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build
      - lint
      - typecheck
      - lighthouse
    steps:
      - name: Summarize results
        run: |
          echo "Build:      ${{ needs.build.result }}"
          echo "Lint:       ${{ needs.lint.result }}"
          echo "Typecheck:  ${{ needs.typecheck.result }}"
          echo "Lighthouse: ${{ needs.lighthouse.result }}"
