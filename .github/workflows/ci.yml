name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - 'lighthouserc.json'
      - 'frontend/scripts/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - 'lighthouserc.json'
      - 'frontend/scripts/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PREVIEW_HOST: 127.0.0.1
  PREVIEW_PORT: 4173
  LIGHTHOUSE_ARTIFACT_DIR: frontend/.lighthouseci

jobs:
  build-test:
    name: build-test (pull_request)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  lint:
    name: Lint (pull_request)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

  typecheck:
    name: Typecheck (pull_request)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

  test:
    name: Test (pull_request)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

  lighthouse:
    name: Lighthouse CI (pull_request)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create Puppeteer cache directory
        run: mkdir -p /home/runner/.cache/puppeteer

      - name: Restore Puppeteer cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Build frontend
        run: npm run build

      - name: Ensure Lighthouse artifact directory exists
        run: mkdir -p "${{ github.workspace }}/${{ env.LIGHTHOUSE_ARTIFACT_DIR }}"

      - name: Start preview server
        run: |
          npm run preview -- --host "${PREVIEW_HOST}" --port "${PREVIEW_PORT}" > /tmp/preview-server.log 2>&1 &
          echo $! > /tmp/preview-server.pid
          echo "Preview server PID: $(cat /tmp/preview-server.pid)"

      - name: Wait for preview server
        run: |
          npx wait-on "http://${PREVIEW_HOST}:${PREVIEW_PORT}" --timeout 180000
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused "http://${PREVIEW_HOST}:${PREVIEW_PORT}"

      - name: Prepare Lighthouse config
        run: node scripts/prepare-lighthouse-config.mjs

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.1 autorun --config=/tmp/lhcirc.json

      - name: Write Lighthouse scores
        run: node scripts/lighthouse-guard.mjs --write

      - name: Compare Lighthouse baseline
        run: node scripts/lighthouse-guard.mjs --compare

      - name: Write Lighthouse summary
        run: node scripts/lighthouse-summary.mjs

      - name: Ensure fallback score files exist
        if: always()
        run: |
          mkdir -p "${{ github.workspace }}/${{ env.LIGHTHOUSE_ARTIFACT_DIR }}"
          test -f "${{ github.workspace }}/${{ env.LIGHTHOUSE_ARTIFACT_DIR }}/lighthouse-scores.json" || echo '{}' > "${{ github.workspace }}/${{ env.LIGHTHOUSE_ARTIFACT_DIR }}/lighthouse-scores.json"
          test -f "${{ github.workspace }}/${{ env.LIGHTHOUSE_ARTIFACT_DIR }}/infra-metadata.json" || echo '{}' > "${{ github.workspace }}/${{ env.LIGHTHOUSE_ARTIFACT_DIR }}/infra-metadata.json"

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-artifacts-${{ github.run_id }}
          path: |
            frontend/.lighthouseci/**
            frontend/lighthouse-results/**
          if-no-files-found: warn

      - name: Show preview log on failure
        if: failure()
        run: |
          echo "===== /tmp/preview-server.log ====="
          cat /tmp/preview-server.log || true

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview-server.pid ]; then
            kill "$(cat /tmp/preview-server.pid)" || true
          fi

  ci-summary:
    name: CI Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build-test
      - lint
      - typecheck
      - test
      - lighthouse
    steps:
      - name: Job summary
        run: |
          echo "## CI Summary" > "$GITHUB_STEP_SUMMARY"
          echo "" > "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" > "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" > "$GITHUB_STEP_SUMMARY"
          echo "| build-test | ${{ needs.build-test.result }} |" > "$GITHUB_STEP_SUMMARY"
          echo "| lint | ${{ needs.lint.result }} |" > "$GITHUB_STEP_SUMMARY"
          echo "| typecheck | ${{ needs.typecheck.result }} |" > "$GITHUB_STEP_SUMMARY"
          echo "| test | ${{ needs.test.result }} |" > "$GITHUB_STEP_SUMMARY"
          echo "| lighthouse | ${{ needs.lighthouse.result }} |" > "$GITHUB_STEP_SUMMARY"
