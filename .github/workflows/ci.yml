name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Frontend-only CI: avoid root-level npm/tooling nondeterminism in this monorepo.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Typecheck
        working-directory: frontend
        run: npm run -s typecheck

      - name: Test
        working-directory: frontend
        run: npm run -s test:ci

      - name: CSP inline-style lint
        working-directory: frontend
        run: npm run -s csp:lint

      - name: CSP header baseline lint
        working-directory: frontend
        run: npm run -s csp:headers:lint

      - name: External domains allowlist lint
        working-directory: frontend
        run: npm run -s domains:lint

      - name: Verify security headers artifact
        working-directory: frontend
        run: |
          test -f dist/_headers || {
            echo "❌ Missing dist/_headers. Ensure frontend/public/_headers is copied during postbuild."
            exit 1
          }

      - name: Install Playwright browsers (Chromium) via official action
        uses: microsoft/playwright-github-action@v1
        with:
          working-directory: frontend
          with-deps: true

      - name: Ensure Chromium only
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: npx playwright install chromium

      - name: E2E Playwright runtime gate
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
          PLAYWRIGHT_USE_LOCAL_SERVER: "1"
          UX_AUDIT_STRICT: "1"
        run: npm run -s e2e:ci

      - name: Dependency audit (non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
