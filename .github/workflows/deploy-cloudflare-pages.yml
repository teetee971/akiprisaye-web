name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd a-ki-pri-sa-ye-functional && npm ci

      - name: Run tests
        run: |
          npm run test:run
          npm run check

      - name: Run validation tests
        run: node test_validation.js

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse optimization
        run: node lighthouse-optimize.js

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            lighthouse-report.json
            lighthouse-optimization-report.json
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [test, lighthouse]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (fix esbuild + tailwind)
        run: |
          npm uninstall lightningcss --force || true
          npm install esbuild@0.21.5 --save-dev --force
          npm install postcss postcss-cli autoprefixer --save-dev --legacy-peer-deps
          npm install --legacy-peer-deps

      - name: Build main project
        run: npm run build

      - name: Build functional app
        run: |
          cd a-ki-pri-sa-ye-functional
          npm ci
          npm run build

      - name: Merge builds
        run: |
          # Copy functional app to subdirectory
          mkdir -p dist/public/app
          cp -r a-ki-pri-sa-ye-functional/dist/* dist/public/app/
          
          # Copy PWA files to root of public
          cp public/manifest.webmanifest dist/public/
          cp public/service-worker.js dist/public/
          cp public/*icon*.png dist/public/ 2>/dev/null || true

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: akiprisaye
          directory: dist/public

      - name: Deploy success notification
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Main site: https://akiprisaye.pages.dev"
          echo "Functional app: https://akiprisaye.pages.dev/app"