name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Sanity check dist output
        run: test -f frontend/dist/index.html

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: akiprisaye-web
        run: |
          set -eo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          npx wrangler@3.114.0 pages deploy frontend/dist \
            --project-name "$PROJECT_NAME" \
            --branch main | tee deploy-output.log

          URLS=$(grep -Eo 'https://[^[:space:]"'"')>]*\.pages\.dev[^[:space:]"'"')>]*' deploy-output.log || true)
          if [ -n "$URLS" ]; then
            echo "pages.dev URLs found:"
            printf '%s\n' "$URLS"
          fi

          DEPLOY_URL=$(printf '%s\n' "$URLS" | sed '/^$/d' | tail -n1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "Failed to detect deployment URL from Wrangler output."
            exit 1
          fi

          echo "Selected deployment URL (latest): $DEPLOY_URL"
