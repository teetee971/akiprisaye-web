name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test --if-present

      - name: Build project
        run: npm run build

      - name: Run end-to-end tests
        run: |
          npx http-server ./dist -p 3000 &   # Lance un serveur local
          sleep 10
          curl -I http://localhost:3000/ | grep "200 OK"
          curl -I http://localhost:3000/compare.html | grep "200 OK"
          curl -I http://localhost:3000/actualites.html | grep "200 OK"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: akiprisaye
          directory: ./dist

      - name: Verify Deployment
        run: |
          sleep 20
          curl -I https://akiprisaye.pages.dev | grep "200 OK"

  rollback:
    runs-on: ubuntu-latest
    needs: build-test-deploy
    if: failure()
    steps:
      - name: Rollback to previous deployment
        run: |
          echo "⚠️ Rolling back to previous successful version..."
          curl -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/akiprisaye/deployments/rollback" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json"